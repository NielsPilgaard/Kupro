  --acc: #2c7a6a;

  --on-acc: #ffffff;
  --side: #1c2a26;

  --prog: #b5651f;
  --rev: #6553a8;
  --ok: #3f8a3c;
  --warn: #a9801a;
  --bad: #b3393b;

  /* Project colours (named in the API: ProjectColor). */
  --proj-verdigris: #2c7a6a;
  --proj-copper: #b5651f;
  --proj-plum: #6553a8;
  --proj-moss: #3f8a3c;
  --proj-ochre: #a9801a;
  --proj-brick: #b3393b;
  --proj-slate: #56708a;

  --sel: color-mix(in srgb, var(--acc) 13%, transparent);

  --font-display: 'Bricolage Grotesque Variable', system-ui, sans-serif;

  --row: 34px;

  --topbar: 48px;
  --control: 30px;
  --sidebar: 212px;

  --shadow-float: 0 24px 60px -12px rgb(0 0 0 / 0.45);

  --scrim: rgb(0 0 0 / 0.35);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur-1: 120ms;
  --dur-2: 160ms;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.proto{background:var(--side);color:var(--side-ink);font:12px var(--font-mono);padding:6px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:20}
.proto span.t{flex:1;min-width:180px}.proto label{display:inline-flex;gap:6px;align-items:center}
.proto button,.proto select{font:inherit;background:transparent;color:inherit;border:1px solid currentColor;border-radius:var(--r1);padding:2px 8px;cursor:pointer;max-width:260px}
.proto select option{color:var(--ink);background:var(--panel)}
h1{font:600 22px var(--font-display);margin:0 0 4px}
h2{font:600 16px var(--font-display);margin:0 0 8px}
h3{font:600 14px var(--font-ui);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 16px}
.btn{height:var(--control);padding:0 12px;border-radius:var(--r1);border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--acc-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input.f:focus,select.f:focus,textarea.f:focus{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mute{color:var(--mute)}
.mono{font-family:var(--font-mono)}
.key{font:12px var(--font-mono);color:var(--mute)}
.hint{font-size:12px;color:var(--mute)}
.err{font-size:12px;color:var(--bad)}
kbd{font:11px var(--font-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--mute);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.acc{background:var(--sel);color:var(--acc-ink)}
.chip.prog{background:color-mix(in srgb,var(--prog) 15%,transparent);color:var(--prog)}
input.f,select.f,textarea.f{height:var(--control);border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);padding:0 8px;min-width:0}
textarea.f{height:auto;padding:6px 8px;resize:vertical}
.note{font-size:13px;color:var(--mute);max-width:680px}
.wrap{max-width:1000px;margin:0 auto;padding:28px 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
a.card{color:inherit;text-decoration:none}a.card:hover{border-color:var(--acc)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--side);color:var(--side-ink);padding:8px 8px 8px 14px;border-radius:var(--r1);display:none;z-index:40;align-items:center;gap:10px;box-shadow:var(--shadow-float);max-width:calc(100vw - 32px)}
.toast.on{display:flex}.toast button{all:unset;cursor:pointer;color:var(--acc);font-weight:600;padding:2px 8px}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r2);padding:10px 12px;font-size:13px}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.banner.info{background:var(--sunk);border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pop{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:30}
.pop.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow-float);width:min(520px,calc(100vw - 32px));padding:18px;max-height:80vh;overflow:auto}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld>label{font-size:12px;color:var(--mute)}
table.t{border-collapse:collapse;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.t th,.t td{padding:0 10px;height:var(--row);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t th{font-size:12px;color:var(--mute);font-weight:500;background:var(--sunk)}
.t tr:last-child td{border-bottom:0}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.stage{position:relative;transform:translateZ(0);height:calc(100vh - 30px);overflow:hidden;background:var(--bg)}
body.phone{background:var(--sunk)}
body.phone .stage{width:360px;height:min(740px,calc(100vh - 60px));margin:14px auto;border:8px solid var(--side);border-radius:26px}
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side .ws{font:600 15px var(--font-display);padding:6px 10px 14px}
.side button{all:unset;cursor:pointer;height:var(--nav-item);padding:0 10px;border-radius:var(--r1);display:flex;align-items:center;gap:8px}
.side button[aria-current=true]{background:var(--side-sel);font-weight:600}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;padding:14px 10px 4px}
.colm{display:flex;flex-direction:column;min-width:0;height:100%}
.top{height:var(--topbar);border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.top .crumbs{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumbs b{color:var(--ink);font-weight:600}
.usage{font:12px var(--font-mono);color:var(--mute);white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--sel);color:var(--acc-ink);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;cursor:pointer}
.menu{display:none}
main#main{flex:1;overflow:auto;padding:20px 24px 110px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.st i{width:9px;height:9px;border-radius:50%;border:2px solid var(--mute);display:inline-block}
.st.inProgress i{border-color:var(--prog);background:color-mix(in srgb,var(--prog) 40%,transparent)}
.st.inReview i{border-color:var(--rev)}
.st.done i{border-color:var(--ok);background:var(--ok)}
.st.todo i{border-color:var(--mute)}
.st.backlog i{border-style:dashed}
tr.flash td,.icard.flash{animation:flash 1.6s var(--ease)}
@keyframes flash{0%{background:var(--sel)}100%{background:transparent}}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--sunk)}
.icards{display:none}
.icard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.icard .k{font:12px var(--font-mono);color:var(--mute)}
.icard .m{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:4px}
.issue{display:grid;grid-template-columns:1fr 240px;gap:24px;align-items:start}
.props{display:grid;gap:10px;margin:0}
.props dt{font-size:12px;color:var(--mute)}.props dd{margin:0}
.desc{color:var(--ink);max-width:640px}
.cmt{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.cmt b{font-weight:600}
.cbox{position:relative;margin-top:10px}
.cbox textarea{width:100%;min-height:84px}
.filterbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.diff{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;font-size:13px}
.diff .from{color:var(--mute);text-decoration:line-through}
.diff .to{color:var(--ink);font-weight:600}
.op{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.op:first-child{border-top:0}
.op input{margin-top:3px}
.op .held{font-size:12px;color:var(--warn)}
.said{font-size:13px;color:var(--mute);font-style:italic}
.said b{font-style:normal;color:var(--ink);font-weight:500}
.wave{display:inline-flex;gap:3px;align-items:center;height:20px}
.wave i{width:3px;height:6px;background:var(--acc);border-radius:2px;animation:wave .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{height:5px}50%{height:18px}}
@media (prefers-reduced-motion: reduce){.wave i{animation:none;height:10px}}
.tidy{margin-top:8px;border:1px solid var(--line);border-radius:var(--r2);background:var(--sunk);padding:10px 12px;font-size:13px}
.tidy del{color:var(--bad);text-decoration:line-through;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tidy ins{color:var(--ok);text-decoration:none;background:color-mix(in srgb,var(--ok) 14%,transparent)}
.block{display:grid;gap:8px}
.mic-ico{width:16px;height:16px;flex:none}
/* Phone layout: inside the frame, or on a real small screen. */
body.phone .app{grid-template-columns:1fr}
body.phone .side{display:none}
body.phone .menu{display:inline-flex}
body.phone main#main{padding:14px 12px 120px}
body.phone .t{display:none}
body.phone .icards{display:block}
body.phone .issue{grid-template-columns:1fr;gap:12px}
body.phone .usage{display:none}
body.phone .top{padding:0 8px;gap:6px}
/* On a real phone the frame is the phone itself: no drawn bezel, and the stage takes the height the bar leaves. */
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.proto{flex:none}
.stage{flex:1;min-height:0;height:auto}
@media (max-width:700px){body.phone .stage{width:auto;height:auto;margin:0;border:0;border-radius:0}}
.micbtn{height:var(--control);border:1px solid var(--line);border-radius:99px;background:var(--panel);display:inline-flex;align-items:center;gap:8px;padding:0 6px 0 10px;cursor:pointer;color:var(--ink)}
.micbtn:hover{border-color:var(--acc)}
.micbtn.live{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.micbtn.live kbd{display:none}
.micbtn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.searchbox{height:var(--control);border:1px solid var(--line);border-radius:var(--r1);background:var(--sunk);color:var(--mute);display:inline-flex;align-items:center;padding:0 10px;font-size:13px;min-width:180px}
.vcard{position:fixed;top:calc(var(--topbar) + 8px);left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow-float);padding:14px 16px;z-index:25}
.vcard[hidden]{display:none}
.vcard .head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.vcard .live{font:500 16px var(--font-ui);min-height:24px}
.vcard .foot{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.cand{display:grid;gap:6px;margin-top:8px}
.cand button{text-align:left;justify-content:flex-start;height:auto;padding:8px 10px}
body.phone .searchbox,body.phone .micbtn kbd{display:none}
body.phone .micbtn .lbl{display:none}
body.phone .micbtn{padding:0 8px}
</style>

  '<label>AI <select id="pAi"><option value="budget">Kupro hours (3.5 of 12 used)</option><option value="spent">Kupro hours spent</option><option value="own">Own Scaleway key</option><option value="rejected">Own key rejected</option></select></label>'+
  '<label>Device <select id="pDev"><option value="desktop">Desktop</option><option value="phone">Phone 360</option></select></label>'+
  '<label>Viewing as <select id="pRole"><option value="1">Owner</option><option value="0">Member</option></select></label>'+(extra||'')+
  '<button type="button" onclick="toggleTheme()">Theme</button>');
 pSay.onchange=function(){V.sample=pSay.value};
 pAi.onchange=function(){V.ai=pAi.value;renderUsage();if(window.onAiChange)onAiChange()};
 pDev.onchange=function(){V.device=pDev.value;document.body.classList.toggle('phone',V.device==='phone')};
 pRole.onchange=function(){V.billing=pRole.value==='1'};
 if(innerWidth<700){pDev.value='phone';pDev.onchange()}
}

// ---- App shell
function shell(topSlot){
 document.getElementById('stage').innerHTML='<div class="app"><nav class="side" aria-label="Main"><div class="ws">Fjord Labs</div>'+
  '<button aria-current="true" onclick="go({name:\'list\'})">Issues</button><button>Board</button><button>Sprints</button><button>Delivery plan</button><div class="grp">Workspace</div><button>Members</button><button>Settings</button></nav>'+
  '<div class="colm"><header class="top"><button class="btn ghost menu" aria-label="Menu">☰</button><div class="crumbs" id="crumbs"></div><span class="sp"></span>'+(topSlot||'')+'<span class="usage" id="usage"></span><div class="avatar" title="'+ME+'">MK</div></header><main id="main"></main></div></div><div class="toast" id="toast" role="status"></div><div class="sr" aria-live="polite" id="live"></div>';
 renderUsage();render();
}
function renderUsage(){var u=document.getElementById('usage');if(!u)return;u.textContent={budget:'AI · 3.5 of 12 h',spent:'AI · 12 of 12 h',own:'AI · own key',rejected:'AI · key rejected'}[V.ai]}
function go(view){V.view=view;render()}
function render(){
 var m=document.getElementById('main'),c=document.getElementById('crumbs');
 if(V.view.name==='issue'){var i=issue(V.view.key);c.innerHTML='KUP / <b>'+i.key+'</b>';
  m.innerHTML='<div class="issue"><div><div class="key">'+i.key+'</div><h1>'+esc(i.title)+'</h1><p class="desc">'+(esc(i.desc)||'<span class="mute">No description.</span>')+'</p>'+
  '<h2 style="margin-top:20px">Comments</h2>'+i.comments.map(function(x){return '<div class="cmt"><b>'+esc(x[0])+'</b> <span class="mute">· 2 d</span><div>'+esc(x[1])+'</div></div>'}).join('')+
  '<div class="cbox" id="cbox"><textarea class="f" id="comment" placeholder="Write a comment…" aria-label="Comment"></textarea><div id="tidySlot"></div><div class="row" style="margin-top:6px"><span class="sp"></span><button class="btn pri" onclick="postComment()">Comment</button></div></div></div>'+
  '<dl class="props"><dt>State</dt><dd>'+stHtml(i.state)+'</dd><dt>Sprint</dt><dd>'+fmt('sprint',i.sprint)+'</dd><dt>Assignee</dt><dd>'+fmt('a',i.assignee)+'</dd><dt>Estimate</dt><dd>'+fmt('e',i.est)+'</dd></dl></div>';
  if(window.onIssueRendered)onIssueRendered();
  return}
 var f=V.view.filter,rows=ISSUES.filter(function(i){return !f||(i.assignee===f.assignee&&i.sprint===f.sprint)});
 c.innerHTML='KUP / <b>Issues</b>';
 m.innerHTML='<h1>Issues</h1><p class="sub">Project KUP · '+rows.length+' issues</p>'+(f?'<div class="filterbar"><span class="chip acc">Assignee: me</span><span class="chip acc">Sprint: '+f.sprint+'</span><button class="btn ghost" onclick="go({name:\'list\'})">Clear</button></div>':'')+
  '<table class="t"><thead><tr><th>Key</th><th>Title</th><th>State</th><th>Sprint</th><th>Assignee</th><th class="n">Estimate</th></tr></thead><tbody>'+
  rows.map(function(i){return '<tr class="click" data-k="'+i.key+'" onclick="go({name:\'issue\',key:\''+i.key+'\'})"><td class="key">'+i.key+'</td><td>'+esc(i.title)+'</td><td>'+stHtml(i.state)+'</td><td>'+fmt('s',i.sprint)+'</td><td>'+fmt('a',i.assignee)+'</td><td class="n">'+fmt('e',i.est)+'</td></tr>'}).join('')+'</tbody></table>'+
  '<div class="icards">'+rows.map(function(i){return '<div class="icard" data-k="'+i.key+'" onclick="go({name:\'issue\',key:\''+i.key+'\'})"><div class="k">'+i.key+'</div><div>'+esc(i.title)+'</div><div class="m">'+stHtml(i.state)+'<span>'+(i.sprint||'No sprint')+'</span><span>'+(i.assignee||'Unassigned')+'</span></div></div>'}).join('')+'</div>';
}
function postComment(){var t=document.getElementById('comment');if(!t.value.trim())return;issue(V.view.key).comments.push([ME,t.value.trim()]);render();toast('Comment added')}
function flash(k){document.querySelectorAll('[data-k="'+k+'"]').forEach(function(e){e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')})}

// ---- Toast with undo
var toastTimer;
function toast(msg,undo){var t=document.getElementById('toast');t.innerHTML='<span>'+msg+'</span>'+(undo?'<button type="button">Undo</button>':'');t.classList.add('on');
 if(undo)t.querySelector('button').onclick=function(){undo();t.classList.remove('on')};clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},6000)}

// ---- Interpretation
function result(){var s=SAY[V.sample];return JSON.parse(JSON.stringify(s))}
function heldReason(op){if(op.held)return op.held;if(op.conf<.8)return 'Low confidence.';if(op.field==='state'&&op.to==='canceled')return 'Destructive, always asks.';return ''}
function opDiff(op){
 if(op.field==='create')return '<div class="diff"><span class="mute">New issue</span><span class="to">'+esc(op.to)+'</span><span class="mute">Where</span><span>KUP · Backlog</span></div>';
 var i=issue(op.key),from=i[op.field];
 return '<div class="diff"><span class="mute">'+op.label+'</span><span><span class="from">'+(op.field==='state'?STATE_LABEL[from]:(from||'—'))+'</span> → <span class="to">'+(op.field==='state'?STATE_LABEL[op.to]:esc(op.to))+'</span></span></div>';
}
function applyOps(ops){
 var before=[],touched=[];
 ops.forEach(function(op){
  if(op.field==='create'){var n={key:'KUP-158',title:op.to,state:'backlog',sprint:'',assignee:'',est:'',desc:'',comments:[]};ISSUES.push(n);before.push({create:n.key});touched.push(n.key);return}
  var i=issue(op.key);before.push({key:op.key,field:op.field,val:i[op.field]});i[op.field]=op.to;touched.push(op.key)});
 render();touched.forEach(flash);
 var keys=touched.filter(function(k,ix){return touched.indexOf(k)===ix}).join(', ');
 toast((ops.length===1?'Changed ':'Made '+ops.length+' changes on ')+keys,function(){
  before.reverse().forEach(function(b){if(b.create){ISSUES=ISSUES.filter(function(i){return i.key!==b.create})}else{issue(b.key)[b.field]=b.val}});render();toast('Undone')});
}
function navigate(t){go(t.view==='issue'?{name:'issue',key:t.key}:{name:'list',filter:t.filter})}

// ---- Gate: budget and own key
function blocked(){
 if(V.ai==='spent')return{title:'This month’s AI hours are used up',body:'12 of 12 hours used. Voice comes back on 1 December'+(V.billing?', or right away with your own Scaleway key.':'. An Owner can connect the workspace’s own Scaleway key for unlimited voice.'),action:V.billing?'Connect a key':''};
 if(V.ai==='rejected')return{title:'Scaleway rejected the workspace’s key',body:'Voice is off until '+(V.billing?'you replace the key':'an Owner replaces the key')+'. Kupro’s included hours aren’t used meanwhile. Typing still works.',action:V.billing?'Replace key':''};
 return null}
function say(t){var l=document.getElementById('live');if(l)l.textContent=t}
function blockedHtml(b){return '<div class="banner '+(V.ai==='rejected'?'bad':'warn')+'" role="alert"><div><b>'+b.title+'</b><div>'+b.body+'</div>'+(b.action?'<a class="btn ghost" style="padding:0;margin-top:4px" href="../ai-connections/index.html">'+b.action+' →</a>':'')+'</div></div>'}

// ---- Simulated listening
// Voice.listen({mode:'command'|'dictate', onPartial(text), onThinking(), onResult(r)}) returns {stop()}.
var Voice={listen:function(o){
 var words=(o.mode==='dictate'?DICT.raw:SAY[V.sample].say).split(' '),n=0,stopped=false;
 var iv=setInterval(function(){if(n<words.length){n++;o.onPartial(words.slice(0,n).join(' '))}},230);
 return{stop:function(){if(stopped)return;stopped=true;clearInterval(iv);o.onPartial(words.join(' '));o.onThinking&&o.onThinking();
  setTimeout(function(){o.onResult(o.mode==='dictate'?{raw:DICT.raw,tidy:DICT.tidy}:result())},o.mode==='dictate'?450:800)},cancel:function(){stopped=true;clearInterval(iv)}};
}};
function tidyDiffHtml(){return DICT.tidyParts.map(function(p){if(!p[1])return esc(p[0]);return (p[0]?'<del>'+esc(p[0])+'</del>':'')+'<ins>'+esc(p[1])+'</ins>'}).join('')}

// Hold Ctrl+Space anywhere: start on press, stop on release.
function bindHotkey(start,stop){var on=false;
 addEventListener('keydown',function(e){if(e.code==='Space'&&e.ctrlKey&&!on){on=true;e.preventDefault();start()}});
 addEventListener('keyup',function(e){if(on&&(e.code==='Space'||e.key==='Control')){on=false;e.preventDefault();stop()}})}

// Push to talk on a button: hold to talk, or tap once to start and again to stop.
function pushToTalk(btn,start,stop){var t0=0,live=false;
 btn.addEventListener('mousedown',function(e){e.preventDefault()}); // keep focus in a text field for dictation
 btn.addEventListener('pointerdown',function(e){e.preventDefault();try{btn.setPointerCapture(e.pointerId)}catch(x){}if(live){live=false;stop();return}t0=Date.now();live=true;start()});
 btn.addEventListener('pointerup',function(){if(live&&Date.now()-t0>350){live=false;stop()}});
 btn.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();if(live){live=false;stop()}else{live=true;start()}}});
 return{reset:function(){live=false}}}
function focusedField(){var a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type==='text'))?a:null}
function insertAtCursor(el,text){var s=el.selectionStart,e=el.selectionEnd,v=el.value;var pre=v.slice(0,s),sep=pre&&!/\s$/.test(pre)?' ':'';el.value=pre+sep+text+v.slice(e);var p=s+sep.length+text.length;el.setSelectionRange(p,p);el.focus()}
protoBar();
shell('<span class="searchbox">Search… <span class="sp"></span><kbd>Ctrl K</kbd></span><button class="micbtn" id="mic" aria-label="Talk to Kupro. Hold, or press to start and again to stop." title="Hold Ctrl+Space">'+micSvg()+'<span class="lbl" id="micLbl">Talk</span><kbd>Ctrl Space</kbd></button>');
document.getElementById('stage').insertAdjacentHTML('beforeend','<div class="vcard" id="vcard" role="dialog" aria-label="Voice" hidden></div>');
var card=document.getElementById('vcard'),mic=document.getElementById('mic'),lbl=document.getElementById('micLbl'),session=null,target=null,pending=null;
document.addEventListener('focusin',function(){lbl.textContent=focusedField()?'Dictate':'Talk'});
document.addEventListener('focusout',function(){setTimeout(function(){lbl.textContent=focusedField()?'Dictate':'Talk'},0)});
function show(html){card.innerHTML=html;card.hidden=false}
function closeCard(){card.hidden=true;pending=null;mic.classList.remove('live');ptt.reset()}
function start(){
 var b=blocked();if(b){show(blockedHtml(b)+'<div class="foot"><span class="sp"></span><button class="btn" onclick="closeCard()">Close</button></div>');say(b.title);return}
 target=focusedField();mic.classList.add('live');say(target?'Dictating':'Listening');
 show('<div class="head"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><b>'+(target?'Dictating into the comment':'Listening')+'</b><span class="sp"></span><span class="hint">Release to send · Esc cancels</span></div><div class="live" id="liveText"></div>');
 session=Voice.listen({mode:target?'dictate':'command',
  onPartial:function(t){var e=document.getElementById('liveText');if(e)e.textContent=t},
  onThinking:function(){mic.classList.remove('live');var h=card.querySelector('.head');if(h)h.innerHTML='<span class="spin"></span><b>Working it out…</b>'},
  onResult:target?dictated:interpreted});
}
function stop(){if(session){session.stop();session=null}}
var ptt=pushToTalk(mic,start,stop);
bindHotkey(start,stop);
addEventListener('keydown',function(e){
 if(card.hidden)return;
 if(e.key==='Escape'){if(session){session.cancel();session=null}closeCard()}
 if(e.key==='Enter'&&pending&&!e.ctrlKey){e.preventDefault();applyPending()}});
function dictated(r){closeCard();insertAtCursor(target,r.raw);say('Inserted');
 var slot=document.getElementById('tidySlot');if(!slot)return;
 slot.innerHTML='<div class="tidy"><div class="row" style="margin-bottom:6px"><b>Tidy up?</b><span class="hint">Spelling and punctuation only</span></div><div>'+tidyDiffHtml()+'</div><div class="row" style="margin-top:8px"><button class="btn pri" onclick="acceptTidy()">Use tidied text</button><button class="btn ghost" onclick="tidySlot.innerHTML=\'\'">Keep mine</button></div></div>'}
function acceptTidy(){var t=document.getElementById('comment');t.value=t.value.replace(DICT.raw,DICT.tidy);tidySlot.innerHTML='';toast('Tidied')}
function interpreted(r){
 var said='<div class="said">You said <b>“'+esc(r.say)+'”</b>'+(r.lang==='da'?' <span class="chip">Dansk</span>':'')+'</div>';
 if(r.kind==='none'){show(said+'<p>'+esc(r.reason)+'</p><div class="foot"><span class="sp"></span><button class="btn" onclick="closeCard()">Close</button></div>');say(r.reason);return}
 if(r.kind==='navigate'){navigate(r.target);show(said+'<div class="row" style="margin-top:8px"><span class="chip ok">Opened</span>'+esc(r.target.label)+'</div>');say('Opened '+r.target.label);setTimeout(closeCard,1600);return}
 if(r.ambiguous){var a=r.ambiguous;show(said+'<p style="margin:8px 0 0"><b>Which issue?</b> “the login bug” matches two.</p><div class="cand">'+a.candidates.map(function(k){return '<button class="btn" onclick="pick(\''+k+'\')"><span class="key">'+k+'</span> '+esc(issue(k).title)+'</button>'}).join('')+'</div><div class="foot"><span class="sp"></span><button class="btn ghost" onclick="closeCard()">Cancel</button></div>');pending=null;window._amb=a;say('Which issue?');return}
 var held=r.ops.filter(heldReason);
 if(V.auto&&!held.length){closeCard();applyOps(r.ops);return}
 pending=r.ops;
 show(said+'<div style="margin-top:8px">'+r.ops.map(function(op,ix){var h=heldReason(op);return '<label class="op"><input type="checkbox" checked data-ix="'+ix+'"><div class="block"><div class="key">'+(op.key?op.key+' · '+esc(issue(op.key).title):'KUP')+'</div>'+opDiff(op)+(h&&V.auto?'<div class="held">Asked because: '+h+'</div>':'')+'</div></label>'}).join('')+'</div>'+
  '<div class="foot"><label class="hint row"><input type="checkbox" '+(V.auto?'checked':'')+' onchange="V.auto=this.checked"> Apply without asking when sure</label><span class="sp"></span><button class="btn ghost" onclick="closeCard()">Dismiss <kbd>Esc</kbd></button><button class="btn pri" onclick="applyPending()">Apply <kbd>Enter</kbd></button></div>');
 say(r.ops.length+' change'+(r.ops.length>1?'s':'')+' ready. Enter applies.');
}
function pick(k){var a=window._amb;interpreted({say:SAY.ambiguous.say,kind:'operations',ops:[{key:k,field:a.field,label:a.label,to:a.to,conf:.9}]})}
function applyPending(){var boxes=card.querySelectorAll('input[data-ix]'),ops=pending.filter(function(op,ix){return !boxes[ix]||boxes[ix].checked});closeCard();if(ops.length)applyOps(ops)}
function onAiChange(){if(!card.hidden)closeCard()}
</script>
</body>
</html>
