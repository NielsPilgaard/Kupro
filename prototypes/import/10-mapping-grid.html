<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import · 10 Spreadsheet mapping grid · Kupro prototype</title>
<style>
/* Kobber tokens, copied from web/src/styles/tokens.css (docs/design-guide.md). Light by default; the
   prototype bar's theme button sets data-theme="dark". Fonts fall back to system faces: no web fonts here. */
:root {
  color-scheme: light;
  --bg: #f2f4f3; --panel: #ffffff; --sunk: #e7ecea; --line: #d3dbd8; --ink: #16201d; --mute: #56655f;
  --acc: #2c7a6a; --acc-ink: #246859; --on-acc: #ffffff; --side: #1c2a26; --side-ink: #cfe0da;
  --prog: #b5651f; --rev: #6553a8; --ok: #3f8a3c; --warn: #a9801a; --bad: #b3393b;
  --proj-verdigris: #2c7a6a; --proj-copper: #b5651f; --proj-plum: #6553a8; --proj-moss: #3f8a3c;
  --proj-ochre: #a9801a; --proj-brick: #b3393b; --proj-slate: #56708a; --proj-fjord: #2f6f9f;
  --sel: color-mix(in srgb, var(--acc) 13%, transparent);
  --side-sel: color-mix(in srgb, var(--side-ink) 11%, transparent);
  --font-display: 'Bricolage Grotesque Variable', system-ui, sans-serif;
  --font-ui: 'Hanken Grotesk Variable', system-ui, sans-serif;
  --font-mono: 'Fragment Mono', ui-monospace, Consolas, monospace;
  --r1: 5px; --r2: 7px; --row: 34px; --nav-item: 28px; --topbar: 48px; --control: 30px; --sidebar: 212px;
  --shadow-float: 0 24px 60px -12px rgb(0 0 0 / 0.45);
  --scrim: rgb(0 0 0 / 0.35);
  --ease: cubic-bezier(0.2, 0, 0, 1); --dur-1: 120ms; --dur-2: 160ms;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0f1514; --panel: #161f1d; --sunk: #0b100f; --line: #25322e; --ink: #e2ece8; --mute: #8fa29b;
  --acc: #5bb8a3; --acc-ink: #6cc4af; --on-acc: #08130f; --side: #0b100f; --side-ink: #b7cac3;
  --prog: #e08e52; --rev: #a194e6; --ok: #78c36f; --warn: #e3bc55; --bad: #ee6e6e;
  --proj-verdigris: #5bb8a3; --proj-copper: #e08e52; --proj-plum: #a194e6; --proj-moss: #78c36f;
  --proj-ochre: #e3bc55; --proj-brick: #ee6e6e; --proj-slate: #93a9c0; --proj-fjord: #6faedc;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-1: 0ms; --dur-2: 0ms; } }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 18px;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
a { color: var(--acc-ink); }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; }
h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.display { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; }
.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.mute { color: var(--mute); }
.sm { font-size: 12px; line-height: 16px; }
.xs { font-size: 11px; line-height: 16px; }
.md { font-size: 14px; line-height: 22px; }
.strong { font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; color: var(--mute); background: var(--panel); }

/* ---------- Prototype bar ---------- */
.proto { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: var(--sunk);
  border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--mute); flex: none; }
.proto b { color: var(--ink); }
.proto .sp { flex: 1; }
.proto button { background: none; border: 1px solid var(--line); border-radius: var(--r1); padding: 1px 8px; cursor: pointer; color: var(--mute); }

/* ---------- Shell ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: var(--sidebar); flex: none; background: var(--side); color: var(--side-ink); padding: 8px;
  display: flex; flex-direction: column; gap: 16px; }
.side .ws { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; font-weight: 600; }
.side .nav { display: flex; flex-direction: column; gap: 2px; }
.side .ni { display: flex; align-items: center; gap: 8px; height: var(--nav-item); padding: 0 8px; border-radius: var(--r1);
  color: var(--side-ink); text-decoration: none; }
.side .ni:hover { background: var(--side-sel); }
.side .ni[aria-current='page'] { background: var(--side-sel); font-weight: 600; }
.side kbd { background: transparent; color: inherit; border-color: var(--side-sel); }
.side .ni .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: .6; }
.side .hd { padding: 0 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
.side .sq { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.side .sfoot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 12px; opacity: .85; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--mute); }
.crumb b { color: var(--ink); font-weight: 600; }
.content { flex: 1; overflow: auto; min-height: 0; }
@media (max-width: 640px) { .side { display: none; } }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: var(--control); padding: 0 12px; border-radius: var(--r1);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-1) var(--ease); text-decoration: none; }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--on-acc); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.primary kbd { background: transparent; color: var(--on-acc); border-color: color-mix(in srgb, var(--on-acc) 45%, transparent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--mute); }
.btn.ghost:hover { color: var(--ink); background: var(--sel); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.input, select.input { height: var(--control); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r1);
  background: var(--panel); min-width: 0; }
select.input { padding-right: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; }
.field > small { font-size: 12px; color: var(--mute); }
.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r1); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; color: var(--mute); }
.seg button[aria-pressed='true'] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--acc); }
.check input { accent-color: var(--acc); width: 14px; height: 14px; margin: 0; }

/* ---------- Surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.pad { padding: 16px; }
.sunk { background: var(--sunk); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
.float { box-shadow: var(--shadow-float); }

/* ---------- Tags, chips, pills, avatars ---------- */
.tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: var(--r1); font-size: 12px;
  font-weight: 600; flex: none; }
.tag.epic { color: var(--rev); background: color-mix(in srgb, var(--rev) 14%, transparent); }
.tag.feature { color: var(--acc-ink); background: color-mix(in srgb, var(--acc-ink) 14%, transparent); }
.tag.task { color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r1);
  font-size: 11px; font-weight: 600; flex: none; color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip.ok { color: var(--ink); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.ok::before { content: '✓'; color: var(--ok); }
.chip.warn { color: var(--ink); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.warn::before { content: '!'; color: var(--warn); font-weight: 700; }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.chip.bad::before { content: '×'; }
.chip.acc { color: var(--acc-ink); background: var(--sel); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 8px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 11px; color: var(--mute); flex: none; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
.pill.bug::before { background: var(--bad); }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: var(--on-acc); flex: none; }
.av.ph { background: transparent !important; border: 1px dashed var(--mute); color: var(--mute); }
.av.agent { border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); }
.ring { flex: none; }
.src { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r1);
  background: var(--sunk); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; font-weight: 600; flex: none; }
.src.lg { width: 40px; height: 40px; font-size: 12px; border-radius: var(--r2); }
.warnline { color: var(--ink); display: flex; gap: 6px; align-items: flex-start; }
.warnline::before { content: '!'; flex: none; width: 14px; height: 14px; border-radius: 3px; background: var(--warn); color: var(--panel);
  font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.okline { display: flex; gap: 6px; align-items: flex-start; }
.okline::before { content: '✓'; color: var(--ok); font-weight: 700; flex: none; }

/* ---------- Tables ---------- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 0 12px; height: 30px;
  background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--acc) 6%, transparent); }
table.t .num, table.t th.num { text-align: right; }
table.t th.num { font-family: inherit; }
.arrow { color: var(--mute); }

/* ---------- Progress ---------- */
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 20px; line-height: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--mute); }

/* ---------- Toast ---------- */
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); border-radius: var(--r2);
  padding: 10px 14px; font-size: 12px; box-shadow: var(--shadow-float); max-width: 380px; z-index: 50; }

/* ---------- Fold choice: two equal options ---------- */
.foldopts { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.foldopts legend { font-weight: 600; font-size: 14px; padding: 0 0 8px; }
.foldopt { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); cursor: pointer; min-width: 0; }
.foldopt:hover { border-color: var(--acc-ink); }
.foldopt:has(input:checked) { border-color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc-ink); }
.foldopt:has(input:focus-visible) { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
.foldopt:has(input:disabled) { cursor: default; }
.foldopt .fmap { display: grid; grid-template-columns: auto 14px 1fr; gap: 2px 6px; font-size: 12px; }
.foldopt .fmap .fl { color: var(--rev); font-weight: 600; }
.foldopt .fcount { font-size: 12px; }
.foldopt .fline { font-size: 12px; line-height: 16px; }
.foldopt .fline b { font-weight: 600; margin-right: 4px; }
@media (max-width: 720px) { .foldopts { grid-template-columns: 1fr; } }

.page { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.tabsbar { display: flex; align-items: center; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
.tabsbar button { border: 0; background: none; height: 38px; padding: 0 12px; cursor: pointer; color: var(--mute); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.tabsbar button .src { width: 22px; height: 22px; font-size: 9px; }
.tabsbar button[aria-selected='true'] { color: var(--ink); font-weight: 600; border-bottom-color: var(--acc-ink); }
.tools { display: flex; align-items: center; gap: 8px; padding: 10px 16px; flex: none; flex-wrap: wrap; }
.tools .input { width: 240px; }
.qf { display: inline-flex; gap: 4px; }
.qf button { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--mute); font-size: 12px; }
.qf button[aria-pressed='true'] { border-color: var(--acc-ink); color: var(--acc-ink); font-weight: 600; background: var(--sel); }
.gridwrap { flex: 1; overflow: auto; min-height: 0; padding: 0 16px 16px; }
.choice { padding: 0 0 12px; }
table.g { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); font-size: 13px; }
table.g th { position: sticky; top: 0; z-index: 2; background: var(--sunk); text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); height: 30px; padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.g td { height: 32px; padding: 0 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); border-right: 1px solid color-mix(in srgb, var(--line) 40%, transparent); white-space: nowrap; }
table.g td:last-child { border-right: 0; }
table.g tr.grp td { background: var(--sunk); font-weight: 600; height: 30px; position: sticky; top: 30px; z-index: 1; }
table.g tr.r:focus { outline: none; }
table.g tr.r:focus td { box-shadow: inset 0 2px 0 -0 var(--acc-ink), inset 0 -2px 0 0 var(--acc-ink); }
table.g tr.r:focus td:first-child { box-shadow: inset 2px 2px 0 0 var(--acc-ink), inset 0 -2px 0 0 var(--acc-ink); }
table.g tr.r.sel td { background: var(--sel); }
table.g tr.r.att td.tgt { background: color-mix(in srgb, var(--warn) 12%, transparent); }
table.g td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
table.g td.tgt select, table.g td.tgt input { height: 26px; border-color: transparent; background: transparent; width: 100%; min-width: 128px; }
table.g td.tgt select:hover, table.g td.tgt input:hover { border-color: var(--line); }
.rule { font-size: 11px; font-weight: 600; }
.rule.edited { color: var(--acc-ink); }
.rule.fold { color: var(--rev); }
.rule.def { color: var(--mute); font-weight: 400; }
.bulk { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--ink); color: var(--bg); flex: none; }
.bulk select, .bulk .btn { color: var(--ink); }
.bulk select { height: 26px; }
table.g td.sm { white-space: normal; line-height: 15px; }
.bulk .btn { height: 26px; }
.foot { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); flex: none; flex-wrap: wrap; }
.foot .m { display: flex; flex-direction: column; }
.foot .m b { font-family: var(--font-mono); font-weight: 400; font-size: 14px; }
.foot .m span { font-size: 11px; color: var(--mute); }
.connect { max-width: 560px; margin: 24px; display: flex; flex-direction: column; gap: 12px; }
.keys { font-size: 11px; color: var(--mute); display: flex; gap: 10px; flex-wrap: wrap; }
.dlg { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 80px; background: var(--scrim); z-index: 40; }
.dlg > div { width: min(560px, 92vw); background: var(--panel); border-radius: var(--r2); box-shadow: var(--shadow-float); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar"><div class="crumb">Settings / <b>Import</b></div><span class="grow"></span><span class="sm mute" id="saved"></span></header>
    <div class="content" style="overflow:hidden"><div class="page" id="page"></div></div>
  </div>
</div>
<div id="dlg"></div>
<script>
/* Shared sample data and helpers (same in every mockup so the directions compare on equal terms). */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const fmt = (n) => Number(n).toLocaleString('en-GB');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

const STATES = ['Backlog', 'Todo', 'In Progress', 'In Review', 'Done', 'Canceled'];
const TYPES = ['Epic', 'Feature', 'Task'];

/* Azure DevOps Services org "Contoso", Agile process (plus one Scrum and one CMMI project). */
const D = {
  source: { kind: 'Azure DevOps Services', short: 'ADO', url: 'https://dev.azure.com/contoso', org: 'Contoso' },
  projects: [
    { id: 'web', name: 'Webshop', process: 'Agile', items: 4812, key: 'WEB', on: true, color: 'verdigris' },
    { id: 'mob', name: 'Mobile App', process: 'Agile', items: 1904, key: 'MOB', on: true, color: 'copper' },
    { id: 'plat', name: 'Platform', process: 'Scrum', items: 2377, key: 'PLAT', on: true, color: 'plum' },
    { id: 'crm', name: 'Legacy CRM', process: 'CMMI', items: 611, key: 'CRM', on: false, color: 'slate' },
  ],
  /* Webshop (Agile). level = ADO backlog level. */
  types: [
    { src: 'Epic', level: 'Epics', n: 14, to: 'Epic' },
    { src: 'Feature', level: 'Features', n: 96, to: 'Feature' },
    { src: 'User Story', level: 'Stories', n: 1240, to: 'Task' },
    { src: 'Bug', level: 'Stories', n: 512, to: 'Task', label: 'bug' },
    { src: 'Issue', level: 'Stories', n: 18, to: 'Task' },
    { src: 'Task', level: 'Tasks', n: 2870, to: 'Task' },
    { src: 'Test Case', level: 'Test', n: 62, to: 'Skip' },
  ],
  states: [
    { src: 'New', cat: 'Proposed', n: 1306, to: 'Todo', why: 'Category Proposed. 412 with no iteration go to Backlog.' },
    { src: 'Active', cat: 'InProgress', n: 388, to: 'In Progress', why: 'Category InProgress' },
    { src: 'Code Review', cat: 'InProgress', n: 41, to: 'In Review', why: 'Name contains "review"' },
    { src: 'Resolved', cat: 'Resolved', n: 97, to: 'In Review', why: 'Category Resolved' },
    { src: 'Closed', cat: 'Completed', n: 2779, to: 'Done', why: 'Category Completed' },
    { src: 'Removed', cat: 'Removed', n: 139, to: 'Canceled', why: 'Category Removed' },
  ],
  /* match: email | name | none | bot. action: member | placeholder | invite | skip */
  people: [
    { name: 'Mette Sørensen', email: 'mette@contoso.dk', n: 1120, match: 'email', member: 'Mette Sørensen', action: 'member' },
    { name: 'Jonas Kjær', email: 'jonas.kjaer@contoso.dk', n: 884, match: 'email', member: 'Jonas Kjær', action: 'member' },

/* Fake a running import: calls onTick(pct) and onDone(). */
function simulate(onTick, onDone, ms = 2600) {
  const start = performance.now();
  const step = (now) => {
    const pct = Math.min(1, (now - start) / ms);
    onTick(pct);
    if (pct < 1) requestAnimationFrame(step); else onDone && onDone();
  };
  requestAnimationFrame(step);
}

function trelloRows() {
  return [
    { kind: 'Projects', src: 'Marketing site', ctx: 'board', n: 186, t: 'New project MKT', d: 'New project MKT', o: ['New project MKT', 'Skip'], note: 'Card numbers kept' },

    { kind: 'Fields', src: 'Checklists', ctx: 'checklist', n: 41, t: 'description checklist', d: 'description checklist', o: ['description checklist', 'Tasks under a Feature'], note: 'Items with their own member or date can become Tasks' },

const SRCS = { ado: { label: 'Azure DevOps · Contoso', short: 'ADO', rows: adoRows() }, jira: { label: 'Jira · Payments', short: 'JRA', rows: jiraRows() }, trello: { label: 'Trello · Marketing site', short: 'TRL', rows: trelloRows() } };
const S = { connected: false, src: 'ado', q: '', qf: 'all', active: 0, sel: new Set(), anchor: null, fold: 'tasks', init: 'label', phase: 'map', pct: 0 };
function setFold(k) { S.fold = k; applyFold(); draw(); $('.foldopt input:checked').focus(); }
function setInit(k) { S.init = k; applyFold(); draw(); $('.foldopt input:checked').focus(); }
function applyFold() {
  // The hierarchy choice drives the type rows it touches; those cells show "hierarchy" as their rule.
  SRCS.ado.rows.filter((r) => r.foldable).forEach((r) => { const f = foldType({ src: r.src, to: r.d }, S.fold); r.t = f; r.byFold = f !== r.d; });
  const jmap = S.init === 'label' ? { Initiative: 'Label', Epic: 'Epic', Story: 'Task' } : { Initiative: 'Epic', Epic: 'Feature', Story: 'Task' };
  SRCS.jira.rows.filter((r) => r.foldable).forEach((r) => { if (jmap[r.src]) { r.t = jmap[r.src]; r.byFold = r.src !== 'Story' && (S.init === 'epic'); r.note = r.src === 'Story' ? (S.init === 'label' ? 'Feature when it has sub-tasks (212)' : 'Sub-tasks move under the Feature, relates to the Story') : r.note; } });
}
const rows = () => SRCS[S.src].rows;
const visible = () => rows().map((r, i) => ({ r, i })).filter(({ r }) => (!S.q || (r.src + ' ' + r.ctx + ' ' + r.t).toLowerCase().includes(S.q.toLowerCase()))
  && (S.qf === 'all' || (S.qf === 'att' && r.att && !(r.input ? r.t : r.t !== '')) || (S.qf === 'att' && r.att && r.kind === 'People') || (S.qf === 'edited' && r.t !== r.d && !r.byFold)));
const cell = (r, i) => r.input ? `<input class="input mono" value="${esc(r.t)}" placeholder="hours" data-i="${i}" aria-label="${esc(r.src)}: hours per point" tabindex="-1">`
  : `<select class="input" data-i="${i}" aria-label="${esc(r.src)} target" tabindex="-1">${r.o.map((o) => `<option value="${esc(o)}" ${o === r.t ? 'selected' : ''}>${o === '' ? 'Pick a state' : esc(o)}</option>`).join('')}</select>`;
const ruleOf = (r) => r.byFold ? '<span class="rule fold">hierarchy</span>' : r.t !== r.d ? '<span class="rule edited">edited</span>' : r.att && (!r.t) ? '<span class="chip warn">needs you</span>' : r.att ? '<span class="chip warn">check</span>' : '<span class="rule def">default</span>';
function grid() {
  const v = visible(); let lastKind = '';
  const counts = {}; v.forEach(({ r }) => (counts[r.kind] = (counts[r.kind] || 0) + 1));
  return `<table class="g" role="grid" aria-label="Mapping" aria-multiselectable="true"><thead><tr><th style="width:28px"><span class="sr">Selected</span></th><th>Source value</th><th>Context</th><th style="text-align:right">Items</th><th>→ In Kupro</th><th>Rule</th><th>Why</th></tr></thead><tbody>
    ${v.map(({ r, i }) => { const g = r.kind !== lastKind ? `<tr class="grp"><td colspan="7">${r.kind} <span class="xs mute mono">${counts[r.kind]}</span></td></tr>` : ''; lastKind = r.kind;
      return g + `<tr class="r ${S.sel.has(i) ? 'sel' : ''} ${r.att && (!r.t || r.kind === 'People') ? 'att' : ''}" tabindex="${i === S.active ? 0 : -1}" data-i="${i}" aria-selected="${S.sel.has(i)}">
        <td><input type="checkbox" ${S.sel.has(i) ? 'checked' : ''} tabindex="-1" aria-label="Select ${esc(r.src)}" data-pick="${i}"></td>
        <td><span class="row" style="gap:6px">${r.kind === 'People' ? av(r.src, r.ph) : ''}${esc(r.src)}</span></td><td class="mute">${esc(r.ctx)}</td><td class="num">${fmt(r.n)}</td>
        <td class="tgt"><span class="row" style="gap:6px">${r.state && r.t ? ring(r.t) : ''}${cell(r, i)}</span></td><td>${ruleOf(r)}</td><td class="sm mute">${esc(r.note || '')}</td></tr>`; }).join('')}
    ${v.length ? '' : '<tr><td colspan="7" class="mute" style="height:60px;text-align:center">Nothing matches. Clear the filter to see every row.</td></tr>'}</tbody></table>`;
}
function totals() {
  if (S.src === 'ado') { const f = D.plan[S.fold]; return [['Issues', fmt(f.issues)], ['Epics', fmt(f.epics)], ['Features', fmt(f.features)], ['Tasks', fmt(f.tasks)], ['Re-parented', fmt(f.reparented)], ['Labels from Epics', f.labelsFromEpics]]; }
  if (S.src === 'jira') { const c = INIT[S.init].counts; return [['Issues', '3,140'], ['Epics', c[0]], ['Features', fmt(c[1])], ['Tasks', fmt(c[2])], ['Re-parented', S.init === 'epic' ? 450 : 0], ['Labels', S.init === 'label' ? 4 : 0]]; }
  return [['Issues', '163'], ['Archived', '23'], ['Checklists kept', '41']];
}
function openItems() { return rows().filter((r) => r.att && (r.input || r.o.includes('')) && !r.t).length; }
function draw() {
  if (!S.connected) {
    $('#page').innerHTML = `<div class="connect"><h1>Map everything in one grid</h1><p class="mute">Connect a source. Every type, state, person and field becomes a row you can filter, select in bulk and change with the keyboard.</p>
      <label class="field"><span>Source</span><select class="input"><option>Azure DevOps Services</option><option>Azure DevOps Server</option><option>Jira Cloud</option><option>Trello</option><option>CSV file (columns become rows here)</option></select></label>
      <label class="field"><span>Organization URL</span><input class="input" value="${D.source.url}"></label><label class="field"><span>Personal access token</span><input class="input" type="password" value="••••••••••••••••••••"></label>
      <div class="row"><button class="btn primary" onclick="S.connected=true;draw();focusRow()">Connect and build the grid</button><span class="sm mute">Your Jira and Trello imports are already connected; they show as tabs.</span></div></div>`;
    return;
  }
  const choice = S.src === 'ado' ? foldOptions(S.fold, 'setFold', { legend: 'Hierarchy, a team choice: these type rows follow it' }) : S.src === 'jira' ? initiativeOptions(S.init, 'setInit') : '';
  const sel = S.sel.size, kinds = new Set([...S.sel].map((i) => rows()[i].kind)), k = [...kinds][0];
  const opts = sel && kinds.size === 1 ? rows()[[...S.sel][0]].o : null;
  const open = openItems();
  $('#page').innerHTML = `<div class="tabsbar" role="tablist" aria-label="Imports">${Object.entries(SRCS).map(([id, s]) => `<button role="tab" aria-selected="${S.src === id}" onclick="S.src='${id}';S.sel.clear();S.active=0;draw()"><span class="src">${s.short}</span>${s.label}</button>`).join('')}<button onclick="toast('Opens the connect form for another source.')">${icon('plus', 14)} Add source</button></div>
    <div class="tools"><input class="input" id="q" placeholder="Filter rows" value="${esc(S.q)}" aria-label="Filter rows"><kbd>/</kbd>
      <div class="qf" role="group" aria-label="Quick filter">${[['all', 'All rows'], ['att', 'Needs a look'], ['edited', 'Edited']].map(([id, l]) => `<button aria-pressed="${S.qf === id}" onclick="S.qf='${id}';draw()">${l}</button>`).join('')}</div>
      <span class="grow"></span><span class="keys"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Space</kbd> select</span><span><kbd>Shift ↓</kbd> extend</span><span><kbd>Enter</kbd> edit</span><span><kbd>Esc</kbd> back to row</span><span><kbd>Ctrl A</kbd> select visible</span></span></div>
    ${sel ? `<div class="bulk" role="region" aria-label="Bulk edit"><b>${sel} selected</b>${kinds.size > 1 ? '<span class="sm">Pick rows of one kind to set them together.</span>' : `<span>Set ${k.toLowerCase()} to</span><select class="input" id="bulkTo" aria-label="Bulk target">${opts ? opts.map((o) => `<option>${o === '' ? 'Pick a state' : esc(o)}</option>`).join('') : ''}</select><button class="btn" onclick="bulk()">Apply</button>`}<span class="grow"></span><button class="btn ghost" style="color:var(--bg)" onclick="S.sel.clear();draw()">Clear</button></div>` : ''}
    <div class="gridwrap">${choice ? `<div class="choice">${choice}</div>` : ''}${grid()}</div>
    <div class="foot">${S.phase === 'map' ? totals().map(([l, v]) => `<span class="m"><b>${v}</b><span>${l}</span></span>`).join('') + `<span class="grow"></span>${open ? `<span class="chip warn">${open} row${open > 1 ? 's' : ''} need${open > 1 ? '' : 's'} you</span>` : ''}<button class="btn primary" onclick="plan()">Run dry run</button>`
      : S.phase === 'run' ? `<b>${phaseAt(S.pct)}</b><div class="bar grow"><i style="width:${S.pct * 100}%"></i></div><span class="mono">${Math.round(S.pct * 100)}%</span>`
      : `<span class="okline"><b>Imported</b> · ${totals()[0][1]} issues · 0 conflicts</span><span class="grow"></span><label class="check"><input type="checkbox" checked> Sync hourly</label><button class="btn" onclick="toast('Sync started')">${icon('refresh')} Sync now</button><button class="btn danger" onclick="toast('Undo confirm')">Undo</button><button class="btn" onclick="toast('Finish confirm')">Finish migration</button>`}</div>`;
}
function focusRow() { const tr = $(`tr.r[data-i="${S.active}"]`) || $('tr.r'); if (tr) { S.active = +tr.dataset.i; $$('tr.r').forEach((x) => (x.tabIndex = -1)); tr.tabIndex = 0; tr.focus(); } }
function bulk() { const to = $('#bulkTo').value; [...S.sel].forEach((i) => { rows()[i].t = to === 'Pick a state' ? '' : to; rows()[i].byFold = false; }); toast(`Set ${S.sel.size} rows to ${to}`); S.sel.clear(); saved(); draw(); focusRow(); }
function saved() { $('#saved').textContent = 'Mapping saved · just now'; }
function plan() {
  const open = openItems(); const t = totals();
  $('#dlg').innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-label="Dry run"><div><h2>Dry run · ${SRCS[S.src].label}</h2><div class="row wrap" style="gap:20px">${t.map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    ${open ? `<span class="warnline">${open} row${open > 1 ? 's have' : ' has'} no value yet. ${S.src === 'trello' ? 'Cards in an unmapped list can\'t be imported.' : 'Points-only items import without effort.'}</span>` : '<span class="okline">Every row has a value.</span>'}
    <span class="sm mute">Also: comments, attachments and history come across with original authors and times.</span>
    <div class="row"><span class="grow"></span><button class="btn" onclick="closeDlg()">Back to the grid</button><button class="btn primary" ${S.src === 'trello' && open ? 'disabled' : ''} onclick="closeDlg();run()">Import ${t[0][1]} issues</button></div></div></div>`;
  $('#dlg .btn.primary:not(:disabled), #dlg .btn').focus();
}
function closeDlg() { $('#dlg').innerHTML = ''; focusRow(); }
function run() { S.phase = 'run'; draw(); simulate((p) => { S.pct = p; const b = $('.foot .bar i'); if (b) { b.style.width = p * 100 + '%'; $('.foot b').textContent = phaseAt(p); } }, () => { S.phase = 'done'; $('#side').innerHTML = sidebar(S.src === 'ado' ? IMPORTED_PROJECTS : []); draw(); }); }
document.addEventListener('change', (e) => {
  if (e.target.dataset.pick) { const i = +e.target.dataset.pick; S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); S.active = i; draw(); focusRow(); return; }
  if (e.target.matches('td.tgt select')) { const r = rows()[+e.target.dataset.i]; r.t = e.target.value; r.byFold = false; saved(); const i = +e.target.dataset.i; draw(); const s = $(`td.tgt [data-i="${i}"]`); s && s.focus(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; const pos = e.target.selectionStart; draw(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.matches('td.tgt input')) { rows()[+e.target.dataset.i].t = e.target.value; saved(); }
});
document.addEventListener('click', (e) => { const tr = e.target.closest('tr.r'); if (tr && !e.target.matches('select, input, option')) { S.active = +tr.dataset.i; focusRow(); } });
document.addEventListener('keydown', (e) => {
  if ($('#dlg').innerHTML && e.key === 'Escape') { closeDlg(); return; }
  if (e.key === '/' && !e.target.matches('input, select')) { e.preventDefault(); $('#q') && $('#q').focus(); return; }
  if (e.key === 'Escape' && e.target.closest('td.tgt')) { e.preventDefault(); focusRow(); return; }
  const tr = e.target.closest && e.target.closest('tr.r'); if (!tr || e.target !== tr) return;
  const rs = $$('tr.r'); const idx = rs.indexOf(tr);
  const moveTo = (j) => { j = Math.max(0, Math.min(rs.length - 1, j)); const n = rs[j]; S.active = +n.dataset.i; rs.forEach((x) => (x.tabIndex = -1)); n.tabIndex = 0; n.focus(); return +n.dataset.i; };
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = moveTo(idx + (e.key === 'ArrowDown' ? 1 : -1)); if (e.shiftKey) { S.sel.add(+tr.dataset.i); S.sel.add(i); draw(); focusRow(); } }
  if (e.key === 'Home') { e.preventDefault(); moveTo(0); } if (e.key === 'End') { e.preventDefault(); moveTo(rs.length - 1); }
  if (e.key === ' ') { e.preventDefault(); const i = +tr.dataset.i; S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); draw(); focusRow(); }
  if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); const c = tr.querySelector('td.tgt select, td.tgt input'); c && c.focus(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); visible().forEach(({ i }) => S.sel.add(i)); draw(); focusRow(); }
});
applyFold(); draw();
</script>
