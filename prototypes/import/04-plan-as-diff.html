    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    e.target.setAttribute('aria-pressed', String(dark));
    e.target.textContent = dark ? 'Light theme' : 'Dark theme';

let toastTimer;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.innerHTML = msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 5000);
}
/* Fake a running import: calls onTick(pct) and onDone(). */
function simulate(onTick, onDone, ms = 2600) {
  const start = performance.now();
  const step = (now) => {
    const pct = Math.min(1, (now - start) / ms);
    onTick(pct);
    if (pct < 1) requestAnimationFrame(step); else onDone && onDone();
  };
  requestAnimationFrame(step);
}

/* Per-project counts under Fold Epics (old Epics stay as childless Epics, so totals match Keep Epics). */
D.perProjectEpics = [
  { key: 'WEB', name: 'Webshop', issues: 4750, epics: 110, features: 1240, tasks: 3400, skipped: 62 },
  { key: 'MOB', name: 'Mobile App', issues: 1880, epics: 47, features: 590, tasks: 1243, skipped: 24 },
  { key: 'PLAT', name: 'Platform', issues: 2377, epics: 67, features: 820, tasks: 1490, skipped: 0 },
];
const perProject = (fold) => (fold === 'epics' ? D.perProjectEpics : D.perProject);

protoBar('04', 'Plan as a diff');
$('#side').innerHTML = sidebar();
const S = { phase: 'open', tab: 'changes', file: 'WEB', fold: 'tasks', run: 1, pct: 0 };
function setFold(k) { S.fold = k; draw(); $('.foldopt input:checked').focus(); }

function openView() {
  return `<div class="col"><h1>Open an import</h1><p class="mute">Like a pull request into your workspace: Kupro reads the source, shows you every change it would make, and writes nothing until you import.</p></div>
    <div class="compare"><span class="box">${icon('import')} Contoso workspace</span><span class="mute">←</span>
      <select class="input" aria-label="Source"><option>Azure DevOps Services</option><option>Azure DevOps Server</option><option>Jira Cloud</option><option>Jira Data Center</option><option>Trello</option><option>Linear</option><option>CSV file</option><option>Snapshot ZIP</option></select>
      <input class="input" value="${D.source.url}" style="width:260px" aria-label="Organization URL"><input class="input" type="password" value="••••••••••••••••••" style="width:180px" aria-label="Personal access token">
      <button class="btn primary" onclick="S.phase='draft';draw()">Read source and compare</button></div>
    <p class="sm mute">Token: Work Items (Read), Project and Team (Read). Behind a VPN, build the same comparison locally: <code>kupro import azure-devops --local</code></p>`;
}
const lines = () => S.fold === 'tasks' ? [
  ['add', 'WEB-1203', 'Epic', 'Checkout redesign', 'In Progress', 'from #1203 Epic'],
  ['add', 'WEB-3310', 'Feature', 'MobilePay and card payments', 'In Progress', 'from #3310 Feature'],
  ['add', 'WEB-4567', '', 'As a shopper I can pay with MobilePay', 'In Progress', 'from #4567 User Story · alias #4567'],
  ['mov', 'WEB-4571', '', 'Add MobilePay SDK to checkout service', 'Done', 'ADO Task: parent #4567 → WEB-3310, relates WEB-4567'],
  ['mov', 'WEB-4572', '', 'Handle declined payment callback', 'In Progress', 'ADO Task: parent #4567 → WEB-3310, relates WEB-4567'],
  ['add', 'WEB-4602', '', 'Order total rounds wrong in DKK', 'In Review', 'from #4602 Bug · label bug'],
  ['skip', '#4688', '', 'Checkout regression suite', '', 'Test Case · skipped'],
] : [
  ['add', 'label', '', 'checkout-redesign', '', 'from Epic #1203 · on 1 epic'],
  ['add', 'WEB-3310', 'Epic', 'MobilePay and card payments', 'In Progress', 'from #3310 Feature · label checkout-redesign'],
  ['add', 'WEB-4567', 'Feature', 'As a shopper I can pay with MobilePay', 'In Progress', 'from #4567 User Story'],
  ['add', 'WEB-4571', '', 'Add MobilePay SDK to checkout service', 'Done', 'from #4571 Task'],
  ['add', 'WEB-4572', '', 'Handle declined payment callback', 'In Progress', 'from #4572 Task'],
  ['add', 'WEB-4602', '', 'Order total rounds wrong in DKK', 'In Review', 'from #4602 Bug · label bug'],
  ['skip', '#4688', '', 'Checkout regression suite', '', 'Test Case · skipped'],
];
const SIGN = { add: '+', mov: '~', skip: '−', con: '!' };
const dl = ([c, k, t, ti, s, n]) => `<div class="dl ${c}"><span class="s" aria-label="${{ add: 'create', mov: 're-parent', skip: 'skip', con: 'conflict' }[c]}">${SIGN[c]}</span><span class="k">${k}</span><span class="t">${ring(s)}${tag(t)}<span class="trunc">${ti}</span></span><span class="n">${n}</span></div>`;

function changes() {
  if (S.run === 2) return `<div class="file"><header><b>Run 2 · delta since 13:00</b><span class="grow"></span><span class="mono xs"><span style="color:var(--ok)">+4</span> · ~38 · <span style="color:var(--bad)">!2</span></span></header>
    ${D.conflicts.map((c) => `<div class="dl con"><span class="s" aria-label="conflict">!</span><span class="k">${c.key}</span><span class="t"><b>${c.field}</b><span class="trunc">Kupro keeps “${c.kupro}” · source now “${c.source}”</span></span><span class="n">${c.by} edited it in Kupro</span></div>`).join('')}
    ${[['mov', 'WEB-4572', '', 'Handle declined payment callback', 'Done', 'State In Progress → Done (Jonas Kjær in ADO)'], ['mov', 'WEB-4590', '', 'Show MobilePay in order confirmation email', 'In Review', 'State Active → Code Review'], ['add', 'WEB-4811', '', 'Retry MobilePay capture on timeout', 'Todo', 'new in ADO'], ['add', 'WEB-4815', '', 'Vipps logo on payment step', 'Todo', 'ADO #4813 · WEB-4813 exists in Kupro, alias #4813'], ['skip', 'WEB-3990', '', 'Old basket API cleanup', 'Canceled', 'deleted in ADO · left alone in Kupro']].map(dl).join('')}
    <div class="dl"><span></span><span></span><span class="mute">35 more field updates</span><span></span></div></div>`;
  const pp = D.perProject;
  return `<div class="diffwrap"><nav class="tree" aria-label="Changed projects">${pp.map((p) => `<button aria-current="${S.file === p.key}" onclick="S.file='${p.key}';draw()">${icon('chev', 12)}<span class="mono">${p.key}</span>${p.name}<span class="ad">+${fmt(p.issues)}</span></button>`).join('')}
      <button onclick="toast('People: 4 placeholders to create, 0 invites')">${icon('users', 12)}People<span class="ad">+4</span></button><button onclick="toast('96 sprints, 52 labels')">${icon('cycle', 12)}Sprints, labels<span class="ad">+148</span></button></nav>
    <div class="col" style="gap:12px"><div class="file"><header><span class="mono">${S.file}</span><b>${pp.find((p) => p.key === S.file).name}</b><span class="mute xs">Epic › Checkout redesign</span><span class="grow"></span>
      <span class="mono xs"><span style="color:var(--ok)">+${S.fold === 'tasks' ? 6 : 6}</span> · <span style="color:var(--warn)">~${S.fold === 'tasks' ? 2 : 0}</span> · −1</span></header>${lines().map(dl).join('')}</div>
      <div class="file"><header><span class="mono">${S.file}</span><b>13 more epics</b><span class="grow"></span><button class="btn sm" onclick="toast('Expands the next epic')">Expand</button></header></div>
      <p class="xs mute">Hierarchy: <b>${FOLD[S.fold].name}</b> (<a href="#" onclick="S.tab='mapping';draw();return false">change</a>) · + create · ~ re-parented, keeps a relates link to its old parent · − skipped · ! conflict, Kupro wins</p></div></div>`;
}
function mapping() {
  const rule = (title, body, who = 'default for Agile') => `<div class="rule"><header><b>${title}</b><span class="mute">${who}</span><span class="grow"></span><button class="btn sm ghost" onclick="toast('Edits this rule inline; the diff re-runs.')">Edit</button></header><div class="b">${body}</div></div>`;
  return `<div class="col" style="gap:12px">
    ${rule('Hierarchy: four levels into three', foldOptions(S.fold, 'setFold', { legend: 'A team choice. Switch it and the Changes tab re-runs.' }), 'your choice')}
    ${rule('Types', D.types.map((t) => `<div class="maprow"><span>${t.src}</span><span class="arrow">→</span><span>${typeCell(foldType(t, S.fold))}${t.label ? ' <span class="pill bug">bug</span>' : ''}</span><span class="xs mute mono">${fmt(t.n)}</span></div>`).join(''))}
    ${rule('States', D.states.map((s) => `<div class="maprow"><span>${s.src} <span class="xs mute">${s.cat}</span></span><span class="arrow">→</span><span>${stateCell(s.to)}</span><span class="xs mute">${s.why}</span></div>`).join(''))}
    ${rule('People', D.people.filter((p) => p.match !== 'email').map((p) => `<div class="maprow"><span class="row">${av(p.name, !p.member)}${p.name}</span><span class="arrow">→</span><span>${p.member || ACTION_LABEL[p.action]}</span><span>${matchChip(p)}</span></div>`).join('') + '<span class="xs mute">14 more matched by email</span>', 'matched by email, then name')}
    ${rule('Effort', `<div class="row"><span>Hours per story point</span><input class="input mono" style="width:90px" placeholder="none"><span class="sm mute">${fmt(D.plan.pointsOnly)} items have points only. No default.</span></div>`, 'needs you')}</div>`;
}
function checks() {
  const c = [['ok', 'Every work item type is mapped'], ['ok', 'Every state is mapped'], ['ok', 'No key collisions: WEB, MOB, PLAT are free'], ['warn', `${fmt(D.plan.pointsOnly)} items have points but no hours per point: they import without effort`], ['warn', '3 iterations have no dates: they become labels'], ['ok', `${D.plan.bytes} of attachments to copy`], ['ok', 'People: 18 matched, 4 placeholders, 1 skipped']];
  return `<div class="file">${c.map(([k, t]) => `<div class="check-r"><span class="${k === 'ok' ? 'okline' : 'warnline'}">${t}</span></div>`).join('')}</div>`;
}
function mergeBox() {
  if (S.phase === 'draft') return `<div class="merge"><div class="row"><b class="grow">Ready to import</b><span class="chip warn">2 warnings</span></div><span class="sm mute">Creates ${fmt(D.plan[S.fold].issues)} issues in 3 new projects. Undo is offered until you finish the migration.</span>
    <div class="row"><button class="btn primary" onclick="run()">Import ${fmt(D.plan[S.fold].issues)} issues</button><label class="check sm"><input type="checkbox" checked> Then sync hourly</label></div></div>`;
  if (S.phase === 'run') return `<div class="merge"><div class="row"><b class="grow">${phaseAt(S.pct)}</b><span class="mono">${fmt(Math.round(S.pct * D.plan[S.fold].issues))} / ${fmt(D.plan[S.fold].issues)}</span></div><div class="bar"><i style="width:${S.pct * 100}%"></i></div></div>`;
  return `<div class="merge" style="border-color:var(--ok)"><div class="row"><span class="okline grow"><b>Imported</b></span><span class="sm mute">Run 1 · 8 min 41 s · syncing hourly</span></div>
    <div class="row wrap"><button class="btn" onclick="S.run=2;S.tab='changes';draw()">${icon('refresh')} Sync now (show run 2)</button><button class="btn danger" onclick="toast('Undo: deletes what this import created. Refused while native comments or child issues point at it.')">Undo import</button><span class="grow"></span><button class="btn" onclick="toast('Finish migration: stops sync and deletes the token.')">${icon('flag')} Finish migration</button></div></div>`;
}
function draftView() {
  const f = D.plan[S.fold];
  const tabs = [['changes', 'Changes', S.run === 2 ? '44' : fmt(D.plan[S.fold].issues)], ['mapping', 'Mapping', '5 rules'], ['checks', 'Checks', '2 !']];
  return `<div class="col" style="gap:6px"><div class="row wrap"><h1>Azure DevOps · Contoso → Contoso workspace</h1><span class="chip ${S.phase === 'done' ? 'ok' : 'acc'}">${S.phase === 'done' ? 'Imported' : 'Dry run'}</span></div>
    <span class="mute sm">Mette Sørensen opened this import · read 9,093 work items from 3 projects 1 min ago · <span class="mono">kupro import plan 7</span></span></div>
    <div class="tabs" role="tablist">${tabs.map(([id, l, c]) => `<button role="tab" aria-selected="${S.tab === id}" onclick="S.tab='${id}';draw()">${l}<span class="c">${c}</span></button>`).join('')}</div>
    <div class="two"><div class="col" style="gap:16px;min-width:0">${{ changes, mapping, checks }[S.tab]()}${mergeBox()}</div>
    <aside class="side2"><div class="col" style="gap:4px"><h3>Summary</h3><span class="mono">+${fmt(D.plan[S.fold].issues)} issues</span><span class="mono" style="color:var(--warn)">~${fmt(f.reparented)} re-parented</span><span class="mono mute">−${D.plan.skipped} skipped</span>
      <span class="mono mute">${fmt(D.plan.comments)} comments · ${D.plan.bytes}</span><span class="mono mute">${fmt(D.plan.changes)} history entries</span></div>
      <div class="col" style="gap:0"><h3>People</h3>${D.people.slice(0, 6).map((p) => `<div class="p">${av(p.name, !p.member)}<span class="trunc grow">${p.name}</span>${p.match === 'email' ? '' : `<span class="xs mute">${ACTION_LABEL[p.action]}</span>`}</div>`).join('')}<span class="xs mute">+17 more</span></div>
      ${S.phase === 'done' ? `<div class="col"><h3>Runs</h3><div class="timeline"><div class="ev ok">Run 1 · ${fmt(D.plan[S.fold].issues)} created<br><span class="xs mute">today 14:32</span></div>${S.run === 2 ? '<div class="ev ok">Run 2 · 4 created, 38 updated, 2 conflicts<br><span class="xs mute">today 15:00</span></div>' : ''}<div class="ev">Next sync<br><span class="xs mute">${S.run === 2 ? '16:00' : '15:00'}</span></div></div></div>` : ''}</aside></div>`;
}
function draw() { $('#crumb').textContent = S.phase === 'open' ? 'New import' : 'Contoso (Azure DevOps)'; $('#app').innerHTML = S.phase === 'open' ? openView() : draftView(); }
function run() { S.phase = 'run'; draw(); simulate((p) => { S.pct = p; const m = $('.merge'); if (m) m.outerHTML = mergeBox(); }, () => { S.phase = 'done'; $('#side').innerHTML = sidebar(IMPORTED_PROJECTS); draw(); }); }
draw();
</script>
</body>
</html>
