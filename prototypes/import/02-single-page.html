<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* Kobber tokens, copied from web/src/styles/tokens.css (docs/design-guide.md). Light by default; the
   prototype bar's theme button sets data-theme="dark". Fonts fall back to system faces: no web fonts here. */
:root {
  color-scheme: light;
  --bg: #f2f4f3; --panel: #ffffff; --sunk: #e7ecea; --line: #d3dbd8; --ink: #16201d; --mute: #56655f;
  --acc: #2c7a6a; --acc-ink: #246859; --on-acc: #ffffff; --side: #1c2a26; --side-ink: #cfe0da;
  --prog: #b5651f; --rev: #6553a8; --ok: #3f8a3c; --warn: #a9801a; --bad: #b3393b;
  --proj-verdigris: #2c7a6a; --proj-copper: #b5651f; --proj-plum: #6553a8; --proj-moss: #3f8a3c;
  --proj-ochre: #a9801a; --proj-brick: #b3393b; --proj-slate: #56708a; --proj-fjord: #2f6f9f;
  --sel: color-mix(in srgb, var(--acc) 13%, transparent);
  --side-sel: color-mix(in srgb, var(--side-ink) 11%, transparent);
  --font-display: 'Bricolage Grotesque Variable', system-ui, sans-serif;
  --font-ui: 'Hanken Grotesk Variable', system-ui, sans-serif;
  --font-mono: 'Fragment Mono', ui-monospace, Consolas, monospace;
  --r1: 5px; --r2: 7px; --row: 34px; --nav-item: 28px; --topbar: 48px; --control: 30px; --sidebar: 212px;
  --shadow-float: 0 24px 60px -12px rgb(0 0 0 / 0.45);
  --scrim: rgb(0 0 0 / 0.35);
  --ease: cubic-bezier(0.2, 0, 0, 1); --dur-1: 120ms; --dur-2: 160ms;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0f1514; --panel: #161f1d; --sunk: #0b100f; --line: #25322e; --ink: #e2ece8; --mute: #8fa29b;
  --acc: #5bb8a3; --acc-ink: #6cc4af; --on-acc: #08130f; --side: #0b100f; --side-ink: #b7cac3;
  --prog: #e08e52; --rev: #a194e6; --ok: #78c36f; --warn: #e3bc55; --bad: #ee6e6e;
  --proj-verdigris: #5bb8a3; --proj-copper: #e08e52; --proj-plum: #a194e6; --proj-moss: #78c36f;
  --proj-ochre: #e3bc55; --proj-brick: #ee6e6e; --proj-slate: #93a9c0; --proj-fjord: #6faedc;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-1: 0ms; --dur-2: 0ms; } }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 18px;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
a { color: var(--acc-ink); }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; }
h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.display { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; }
.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.mute { color: var(--mute); }
.sm { font-size: 12px; line-height: 16px; }
.xs { font-size: 11px; line-height: 16px; }
.md { font-size: 14px; line-height: 22px; }
.strong { font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; color: var(--mute); background: var(--panel); }

/* ---------- Prototype bar ---------- */
.proto { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: var(--sunk);
  border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--mute); flex: none; }
.proto b { color: var(--ink); }
.proto .sp { flex: 1; }
.proto button { background: none; border: 1px solid var(--line); border-radius: var(--r1); padding: 1px 8px; cursor: pointer; color: var(--mute); }

/* ---------- Shell ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: var(--sidebar); flex: none; background: var(--side); color: var(--side-ink); padding: 8px;
  display: flex; flex-direction: column; gap: 16px; }
.side .ws { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; font-weight: 600; }
.side .nav { display: flex; flex-direction: column; gap: 2px; }
.side .ni { display: flex; align-items: center; gap: 8px; height: var(--nav-item); padding: 0 8px; border-radius: var(--r1);
  color: var(--side-ink); text-decoration: none; }
.side .ni:hover { background: var(--side-sel); }
.side .ni[aria-current='page'] { background: var(--side-sel); font-weight: 600; }
.side kbd { background: transparent; color: inherit; border-color: var(--side-sel); }
.side .ni .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: .6; }
.side .hd { padding: 0 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
.side .sq { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.side .sfoot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 12px; opacity: .85; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--mute); }
.crumb b { color: var(--ink); font-weight: 600; }
.content { flex: 1; overflow: auto; min-height: 0; }
@media (max-width: 640px) { .side { display: none; } }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: var(--control); padding: 0 12px; border-radius: var(--r1);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-1) var(--ease); text-decoration: none; }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--on-acc); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.primary kbd { background: transparent; color: var(--on-acc); border-color: color-mix(in srgb, var(--on-acc) 45%, transparent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--mute); }
.btn.ghost:hover { color: var(--ink); background: var(--sel); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.input, select.input { height: var(--control); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r1);
  background: var(--panel); min-width: 0; }
select.input { padding-right: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; }
.field > small { font-size: 12px; color: var(--mute); }
.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r1); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; color: var(--mute); }
.seg button[aria-pressed='true'] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--acc); }
.check input { accent-color: var(--acc); width: 14px; height: 14px; margin: 0; }

/* ---------- Surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.pad { padding: 16px; }
.sunk { background: var(--sunk); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
.float { box-shadow: var(--shadow-float); }

/* ---------- Tags, chips, pills, avatars ---------- */
.tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: var(--r1); font-size: 12px;
  font-weight: 600; flex: none; }
.tag.epic { color: var(--rev); background: color-mix(in srgb, var(--rev) 14%, transparent); }
.tag.feature { color: var(--acc-ink); background: color-mix(in srgb, var(--acc-ink) 14%, transparent); }
.tag.task { color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r1);
  font-size: 11px; font-weight: 600; flex: none; color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip.ok { color: var(--ink); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.ok::before { content: '✓'; color: var(--ok); }
.chip.warn { color: var(--ink); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.warn::before { content: '!'; color: var(--warn); font-weight: 700; }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.chip.bad::before { content: '×'; }
.chip.acc { color: var(--acc-ink); background: var(--sel); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 8px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 11px; color: var(--mute); flex: none; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
.pill.bug::before { background: var(--bad); }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: var(--on-acc); flex: none; }
.av.ph { background: transparent !important; border: 1px dashed var(--mute); color: var(--mute); }
.av.agent { border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); }
.ring { flex: none; }
.src { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r1);
  background: var(--sunk); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; font-weight: 600; flex: none; }
.src.lg { width: 40px; height: 40px; font-size: 12px; border-radius: var(--r2); }
.warnline { color: var(--ink); display: flex; gap: 6px; align-items: flex-start; }
.warnline::before { content: '!'; flex: none; width: 14px; height: 14px; border-radius: 3px; background: var(--warn); color: var(--panel);
  font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.okline { display: flex; gap: 6px; align-items: flex-start; }
.okline::before { content: '✓'; color: var(--ok); font-weight: 700; flex: none; }

/* ---------- Tables ---------- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 0 12px; height: 30px;
  background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--acc) 6%, transparent); }
table.t .num, table.t th.num { text-align: right; }
table.t th.num { font-family: inherit; }
.arrow { color: var(--mute); }

/* ---------- Progress ---------- */
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 20px; line-height: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--mute); }

/* ---------- Toast ---------- */
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); border-radius: var(--r2);
  padding: 10px 14px; font-size: 12px; box-shadow: var(--shadow-float); max-width: 380px; z-index: 50; }

/* ---------- Fold choice: two equal options ---------- */
.foldopts { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.foldopts legend { font-weight: 600; font-size: 14px; padding: 0 0 8px; }
.foldopt { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); cursor: pointer; min-width: 0; }
.foldopt:hover { border-color: var(--acc-ink); }
.foldopt:has(input:checked) { border-color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc-ink); }
.foldopt:has(input:focus-visible) { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
.foldopt:has(input:disabled) { cursor: default; }
.foldopt .fmap { display: grid; grid-template-columns: auto 14px 1fr; gap: 2px 6px; font-size: 12px; }
.foldopt .fmap .fl { color: var(--rev); font-weight: 600; }
.foldopt .fcount { font-size: 12px; }
.foldopt .fline { font-size: 12px; line-height: 16px; }
.foldopt .fline b { font-weight: 600; margin-right: 4px; }
@media (max-width: 720px) { .foldopts { grid-template-columns: 1fr; } }

.page { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding: 24px; max-width: 1240px; align-items: start; }
.secs { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); scroll-margin-top: 16px; }
.sec > header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
.sec > header .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--mute); flex: none; }
.sec.ok > header .n { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.sec .sum { color: var(--mute); font-size: 12px; }
.sec .bd { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.sec.ok .bd { display: none; }
.sec:not(.ok) .sum { display: none; }
.sec:not(.ok) .edit { display: none; }
.sec .inner { border: 1px solid var(--line); border-radius: var(--r1); overflow: hidden; }
.rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px; }
.rail .card { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.toc { display: flex; flex-direction: column; gap: 2px; }
.toc a { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 6px; border-radius: var(--r1); color: var(--ink); text-decoration: none; }
.toc a:hover { background: var(--sel); }
.toc a .d { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--mute); }
.toc a.ok .d { background: var(--ok); border-color: var(--ok); }
.srcrow { display: flex; gap: 6px; flex-wrap: wrap; }
.srcrow button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 4px; border: 1px solid var(--line); border-radius: var(--r1); background: var(--panel); cursor: pointer; }
.srcrow button .src { width: 22px; height: 22px; font-size: 9px; }
.srcrow button[aria-pressed='true'] { border-color: var(--acc-ink); background: var(--sel); font-weight: 600; }
@media (max-width: 960px) { .page { grid-template-columns: 1fr; } .rail { position: static; } }
</style>
</head>

/* Fake a running import: calls onTick(pct) and onDone(). */
function simulate(onTick, onDone, ms = 2600) {
  const start = performance.now();
  const step = (now) => {
    const pct = Math.min(1, (now - start) / ms);
    onTick(pct);
    if (pct < 1) requestAnimationFrame(step); else onDone && onDone();
  };
  requestAnimationFrame(step);
}

    body: () => `<div class="inner"><table class="t"><thead><tr><th></th><th>Project</th><th>Process</th><th class="num">Items</th><th>Key</th></tr></thead><tbody>${D.projects.map((p) => `<tr><td><input type="checkbox" ${p.on ? 'checked' : ''} aria-label="Import ${p.name}"></td><td>${p.name}</td><td class="mute">${p.process}</td><td class="num">${fmt(p.items)}</td><td><input class="input mono" value="${p.key}" style="width:70px" aria-label="Key"></td></tr>`).join('')}</tbody></table></div>
      <label class="field"><span>Closed work items</span><select class="input" style="max-width:260px"><option>All of them</option><option>Closed in the last 24 months</option></select></label>` },
  { id: 'people', t: 'People', sum: () => '23 people · 18 matched · 4 placeholders · 1 skipped',
    body: () => `<p class="sm mute">Placeholders keep names on history without a login or a seat.</p><div class="inner"><table class="t"><tbody>${D.people.filter((p) => p.match !== 'email').map((p, i) => `<tr><td><div class="row">${av(p.name, !p.member)}<span>${p.name}</span></div></td><td>${matchChip(p)}</td><td class="sm mute">${p.note || ''}</td><td>${peopleSelect(p, i)}</td></tr>`).join('')}</tbody></table></div>
      <button class="btn ghost sm" style="align-self:flex-start" onclick="toast('Shows the 14 email matches.')">Show 14 email matches</button>` },
  { id: 'types', t: 'Hierarchy, types and states', sum: () => `${FOLD[S.fold].name} · 13 types · 12 states mapped by category`,
    body: () => `${foldOptions(S.fold, 'setFold')}
      <div class="row" style="align-items:flex-start;gap:12px"><div class="inner grow"><table class="t"><thead><tr><th>Type</th><th class="num">Items</th><th>Kupro</th></tr></thead><tbody>${D.types.map((t) => `<tr><td>${t.src}</td><td class="num">${fmt(t.n)}</td><td>${typeSelect(foldType(t, S.fold), t.src)}</td></tr>`).join('')}</tbody></table></div>
      <div class="inner grow"><table class="t"><thead><tr><th>State</th><th class="num">Items</th><th>Kupro</th></tr></thead><tbody>${D.states.map((s) => `<tr><td>${s.src} <span class="xs mute">${s.cat}</span></td><td class="num">${fmt(s.n)}</td><td>${stateSelect(s.to, s.src)}</td></tr>`).join('')}</tbody></table></div></div>
      <p class="sm mute">Agile defaults shown. Platform (Scrum) has its own: Product Backlog Item → Task, Committed → In Progress. <a href="#" onclick="return false">Show Scrum</a></p>` },
  { id: 'fields', t: 'Fields and effort', sum: () => `Area Path, Tags → labels · Iterations → sprints · ${S.factor ? S.factor + ' h per point' : 'no hours per point'}`,
    body: () => `<div class="col" style="gap:6px">${D.fields.map((f) => `<label class="check"><input type="checkbox" ${f.on ? 'checked' : ''}> <span>${f.src} → ${f.to}</span><span class="sm mute">${f.note || ''}</span></label>`).join('')}</div>
      <label class="field"><span>Hours per story point</span><input class="input mono" style="width:120px" placeholder="e.g. 6" value="${S.factor}" oninput="S.factor=this.value;drawPlan()"><small>${fmt(D.plan.pointsOnly)} items have points but no Original Estimate. No default: blank means no effort.</small></label>` },
];
function draw() {
  $('#secs').innerHTML = SECS.map((s, i) => `<section class="sec ${S.ok[s.id] ? 'ok' : ''}" id="s-${s.id}" aria-labelledby="h-${s.id}">
    <header><span class="n">${S.ok[s.id] ? '✓' : i + 1}</span><div class="col grow" style="gap:0"><h2 id="h-${s.id}">${s.t}</h2><span class="sum">${s.sum()}</span></div>
      <button class="btn ghost sm edit" onclick="S.ok['${s.id}']=false;draw()">Edit</button></header>
    <div class="bd">${s.body()}<div class="row"><span class="grow"></span><button class="btn" onclick="done('${s.id}')">Looks right</button></div></div></section>`).join('') + result();
  $('#toc').innerHTML = SECS.map((s) => `<a href="#s-${s.id}" class="${S.ok[s.id] ? 'ok' : ''}"><span class="d"></span>${s.t}</a>`).join('') + `<a href="#s-result"><span class="d"></span>Plan and import</a>`;
  drawPlan();
}
function done(id) {
  S.ok[id] = true; draw();
  const nxt = SECS.find((s) => !S.ok[s.id]);
  const el = nxt ? $('#s-' + nxt.id) : $('#s-result');
  el.scrollIntoView({ block: 'start' }); const b = el.querySelector('input, select, button'); b && b.focus({ preventScroll: true });
}
function result() {
  if (S.phase === 'edit') return `<section class="sec" id="s-result"><header><span class="n">6</span><h2 class="grow">Plan and import</h2></header><div class="bd">
    <p class="mute">The numbers on the right are a dry run against your workspace and update as you change anything above. Nothing is written until you import.</p>
    ${S.factor ? '' : `<span class="warnline">${fmt(D.plan.pointsOnly)} items import without effort. Set hours per point under Fields and effort to keep it.</span>`}
    <span class="warnline">3 undated iterations become labels.</span></div></section>`;
  if (S.phase === 'run') return `<section class="sec" id="s-result"><header><span class="n">6</span><h2 class="grow">Importing</h2></header><div class="bd">
    <div class="row"><b id="ph">${phaseAt(S.pct)}</b><span class="grow"></span><span class="mono">${fmt(Math.round(S.pct * D.plan[S.fold].issues))} / ${fmt(D.plan[S.fold].issues)}</span></div><div class="bar"><i style="width:${S.pct * 100}%"></i></div>
    <span class="sm mute">You can leave this page. Kupro emails you when it's done.</span></div></section>`;
  return `<section class="sec" id="s-result"><header><span class="n" style="background:var(--ok);border-color:var(--ok);color:var(--panel)">✓</span><div class="col grow" style="gap:0"><h2>Imported ${fmt(D.plan[S.fold].issues)} issues</h2><span class="sm mute">Run 1 · 8 min 41 s · 0 conflicts</span></div></header><div class="bd">
    <div class="row wrap">${perProject(S.fold).map((p) => `<a class="btn" href="#" onclick="return false"><span class="mono mute">${p.key}</span>${p.name} · ${fmt(p.issues)}</a>`).join('')}</div>
    <label class="check"><input type="checkbox" checked> Sync every hour until I finish the migration</label>
    <div class="row wrap"><button class="btn" onclick="toast('Sync started')">${icon('refresh')} Sync now</button><button class="btn danger" onclick="toast('Confirm dialog: delete the 9,007 issues this import created?')">Undo import</button><span class="grow"></span><button class="btn" onclick="toast('Confirm dialog: stop syncing and delete the token?')">${icon('flag')} Finish migration</button></div></div></section>`;
}
function drawPlan() {
  const f = D.plan[S.fold];
  const ready = SECS.every((s) => S.ok[s.id]);
  $('#plan').innerHTML = `<div class="row"><h3 class="grow">Plan</h3><span class="xs mute">dry run · just now</span></div>
    <dl class="kv"><dt>Issues</dt><dd>${fmt(D.plan[S.fold].issues)}</dd><dt><span class="tag epic">Epic</span></dt><dd>${fmt(f.epics)}</dd><dt><span class="tag feature">Feature</span></dt><dd>${fmt(f.features)}</dd>
    <dt>Task</dt><dd>${fmt(f.tasks)}</dd><dt>Re-parented</dt><dd>${fmt(f.reparented)}</dd><dt>Skipped</dt><dd>${D.plan.skipped}</dd>
    <dt>Placeholders</dt><dd>4</dd><dt>Comments</dt><dd>${fmt(D.plan.comments)}</dd><dt>Attachments</dt><dd>${D.plan.bytes}</dd><dt>Effort</dt><dd>${fmt(D.plan.effortHours + (S.factor ? D.plan.pointsSum * Number(S.factor) || 0 : 0))} h</dd></dl>
    <button class="btn primary" ${ready && S.phase === 'edit' ? '' : 'disabled'} onclick="run()">Import ${fmt(D.plan[S.fold].issues)} issues</button>
    <span class="xs mute">${ready ? (S.phase === 'edit' ? 'Everything checked.' : '') : `${SECS.filter((s) => !S.ok[s.id]).length} sections left to check`}</span>`;
}
function run() {
  S.phase = 'run'; draw(); $('#s-result').scrollIntoView();
  simulate((p) => { S.pct = p; $('#s-result').outerHTML = result(); }, () => { S.phase = 'done'; $('#side').innerHTML = sidebar(IMPORTED_PROJECTS); draw(); });
}
draw();
</script>
</body>
</html>
