<!DOCTYPE html>

<style>
/* Kobber tokens, copied from web/src/styles/tokens.css (docs/design-guide.md). Light by default; the
   prototype bar's theme button sets data-theme="dark". Fonts fall back to system faces: no web fonts here. */
:root {
  color-scheme: light;
  --bg: #f2f4f3; --panel: #ffffff; --sunk: #e7ecea; --line: #d3dbd8; --ink: #16201d; --mute: #56655f;
  --acc: #2c7a6a; --acc-ink: #246859; --on-acc: #ffffff; --side: #1c2a26; --side-ink: #cfe0da;
  --prog: #b5651f; --rev: #6553a8; --ok: #3f8a3c; --warn: #a9801a; --bad: #b3393b;
  --proj-verdigris: #2c7a6a; --proj-copper: #b5651f; --proj-plum: #6553a8; --proj-moss: #3f8a3c;
  --proj-ochre: #a9801a; --proj-brick: #b3393b; --proj-slate: #56708a; --proj-fjord: #2f6f9f;
  --sel: color-mix(in srgb, var(--acc) 13%, transparent);
  --side-sel: color-mix(in srgb, var(--side-ink) 11%, transparent);
  --font-display: 'Bricolage Grotesque Variable', system-ui, sans-serif;
  --font-ui: 'Hanken Grotesk Variable', system-ui, sans-serif;
  --font-mono: 'Fragment Mono', ui-monospace, Consolas, monospace;
  --r1: 5px; --r2: 7px; --row: 34px; --nav-item: 28px; --topbar: 48px; --control: 30px; --sidebar: 212px;
  --shadow-float: 0 24px 60px -12px rgb(0 0 0 / 0.45);
  --scrim: rgb(0 0 0 / 0.35);
  --ease: cubic-bezier(0.2, 0, 0, 1); --dur-1: 120ms; --dur-2: 160ms;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0f1514; --panel: #161f1d; --sunk: #0b100f; --line: #25322e; --ink: #e2ece8; --mute: #8fa29b;
  --acc: #5bb8a3; --acc-ink: #6cc4af; --on-acc: #08130f; --side: #0b100f; --side-ink: #b7cac3;
  --prog: #e08e52; --rev: #a194e6; --ok: #78c36f; --warn: #e3bc55; --bad: #ee6e6e;
  --proj-verdigris: #5bb8a3; --proj-copper: #e08e52; --proj-plum: #a194e6; --proj-moss: #78c36f;
  --proj-ochre: #e3bc55; --proj-brick: #ee6e6e; --proj-slate: #93a9c0; --proj-fjord: #6faedc;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-1: 0ms; --dur-2: 0ms; } }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 18px;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
a { color: var(--acc-ink); }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; }
h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.display { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; }
.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.mute { color: var(--mute); }
.sm { font-size: 12px; line-height: 16px; }
.xs { font-size: 11px; line-height: 16px; }
.md { font-size: 14px; line-height: 22px; }
.strong { font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; color: var(--mute); background: var(--panel); }

/* ---------- Prototype bar ---------- */
.proto { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: var(--sunk);
  border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--mute); flex: none; }
.proto b { color: var(--ink); }
.proto .sp { flex: 1; }
.proto button { background: none; border: 1px solid var(--line); border-radius: var(--r1); padding: 1px 8px; cursor: pointer; color: var(--mute); }

/* ---------- Shell ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: var(--sidebar); flex: none; background: var(--side); color: var(--side-ink); padding: 8px;
  display: flex; flex-direction: column; gap: 16px; }
.side .ws { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; font-weight: 600; }
.side .nav { display: flex; flex-direction: column; gap: 2px; }
.side .ni { display: flex; align-items: center; gap: 8px; height: var(--nav-item); padding: 0 8px; border-radius: var(--r1);
  color: var(--side-ink); text-decoration: none; }
.side .ni:hover { background: var(--side-sel); }
.side .ni[aria-current='page'] { background: var(--side-sel); font-weight: 600; }
.side kbd { background: transparent; color: inherit; border-color: var(--side-sel); }
.side .ni .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: .6; }
.side .hd { padding: 0 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
.side .sq { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.side .sfoot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 12px; opacity: .85; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--mute); }
.crumb b { color: var(--ink); font-weight: 600; }
.content { flex: 1; overflow: auto; min-height: 0; }
@media (max-width: 640px) { .side { display: none; } }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: var(--control); padding: 0 12px; border-radius: var(--r1);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-1) var(--ease); text-decoration: none; }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--on-acc); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.primary kbd { background: transparent; color: var(--on-acc); border-color: color-mix(in srgb, var(--on-acc) 45%, transparent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--mute); }
.btn.ghost:hover { color: var(--ink); background: var(--sel); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.input, select.input { height: var(--control); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r1);
  background: var(--panel); min-width: 0; }
select.input { padding-right: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; }
.field > small { font-size: 12px; color: var(--mute); }
.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r1); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; color: var(--mute); }
.seg button[aria-pressed='true'] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--acc); }
.check input { accent-color: var(--acc); width: 14px; height: 14px; margin: 0; }

/* ---------- Surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.pad { padding: 16px; }
.sunk { background: var(--sunk); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
.float { box-shadow: var(--shadow-float); }

/* ---------- Tags, chips, pills, avatars ---------- */
.tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: var(--r1); font-size: 12px;
  font-weight: 600; flex: none; }
.tag.epic { color: var(--rev); background: color-mix(in srgb, var(--rev) 14%, transparent); }
.tag.feature { color: var(--acc-ink); background: color-mix(in srgb, var(--acc-ink) 14%, transparent); }
.tag.task { color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r1);
  font-size: 11px; font-weight: 600; flex: none; color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip.ok { color: var(--ink); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.ok::before { content: '✓'; color: var(--ok); }
.chip.warn { color: var(--ink); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.warn::before { content: '!'; color: var(--warn); font-weight: 700; }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.chip.bad::before { content: '×'; }
.chip.acc { color: var(--acc-ink); background: var(--sel); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 8px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 11px; color: var(--mute); flex: none; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
.pill.bug::before { background: var(--bad); }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: var(--on-acc); flex: none; }
.av.ph { background: transparent !important; border: 1px dashed var(--mute); color: var(--mute); }
.av.agent { border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); }
.ring { flex: none; }
.src { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r1);
  background: var(--sunk); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; font-weight: 600; flex: none; }
.src.lg { width: 40px; height: 40px; font-size: 12px; border-radius: var(--r2); }
.warnline { color: var(--ink); display: flex; gap: 6px; align-items: flex-start; }
.warnline::before { content: '!'; flex: none; width: 14px; height: 14px; border-radius: 3px; background: var(--warn); color: var(--panel);
  font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.okline { display: flex; gap: 6px; align-items: flex-start; }
.okline::before { content: '✓'; color: var(--ok); font-weight: 700; flex: none; }

/* ---------- Tables ---------- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 0 12px; height: 30px;
  background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--acc) 6%, transparent); }
table.t .num, table.t th.num { text-align: right; }
table.t th.num { font-family: inherit; }
.arrow { color: var(--mute); }

/* ---------- Progress ---------- */
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 20px; line-height: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--mute); }

/* ---------- Toast ---------- */
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); border-radius: var(--r2);
  padding: 10px 14px; font-size: 12px; box-shadow: var(--shadow-float); max-width: 380px; z-index: 50; }

/* ---------- Fold choice: two equal options ---------- */
.foldopts { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.foldopts legend { font-weight: 600; font-size: 14px; padding: 0 0 8px; }
.foldopt { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); cursor: pointer; min-width: 0; }
.foldopt:hover { border-color: var(--acc-ink); }
.foldopt:has(input:checked) { border-color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc-ink); }
.foldopt:has(input:focus-visible) { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
.foldopt:has(input:disabled) { cursor: default; }
.foldopt .fmap { display: grid; grid-template-columns: auto 14px 1fr; gap: 2px 6px; font-size: 12px; }
.foldopt .fmap .fl { color: var(--rev); font-weight: 600; }
.foldopt .fcount { font-size: 12px; }
.foldopt .fline { font-size: 12px; line-height: 16px; }
.foldopt .fline b { font-weight: 600; margin-right: 4px; }
@media (max-width: 720px) { .foldopts { grid-template-columns: 1fr; } }

.center { max-width: 760px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 20px; }
.hero { display: flex; flex-direction: column; gap: 8px; }
.srcs { display: flex; gap: 6px; flex-wrap: wrap; }
.srcs button { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 4px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); cursor: pointer; }
.srcs button .src { width: 28px; height: 28px; }
.srcs button[aria-pressed='true'] { border-color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc-ink); font-weight: 600; }
.sentence { font-size: 16px; line-height: 24px; }
.sentence b { font-family: var(--font-mono); font-weight: 400; }
.decide { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.decide > h2 { display: flex; align-items: center; gap: 8px; }
.decide > h2 .chip { font-weight: 600; }
.defaults { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; }
.defaults .k { color: var(--mute); }
.cta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.cta .btn.primary { height: 38px; padding: 0 18px; font-size: 14px; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow-float); z-index: 40; display: flex; flex-direction: column; }
.drawer header { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: var(--topbar); border-bottom: 1px solid var(--line); flex: none; }
.drawer .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; flex: none; }
.drawer .tabs button { border: 0; background: none; height: 34px; padding: 0 10px; cursor: pointer; color: var(--mute); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.drawer .tabs button[aria-selected='true'] { color: var(--ink); font-weight: 600; border-bottom-color: var(--acc-ink); }
.drawer .bd { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 39; }
.edited { color: var(--acc-ink); font-size: 11px; font-weight: 600; }
</style>
</head>

/* Fake a running import: calls onTick(pct) and onDone(). */
function simulate(onTick, onDone, ms = 2600) {
  const start = performance.now();
  const step = (now) => {
    const pct = Math.min(1, (now - start) / ms);
    onTick(pct);
    if (pct < 1) requestAnimationFrame(step); else onDone && onDone();
  };
  requestAnimationFrame(step);
}

    <div class="srcs" role="group" aria-label="Source">${[['ado', 'ADO', 'Azure DevOps'], ['jira', 'JRA', 'Jira'], ['trello', 'TRL', 'Trello'], ['linear', 'LIN', 'Linear'], ['csv', 'CSV', 'CSV file']].map(([id, s, n]) => `<button aria-pressed="${S.src === id}" onclick="S.src='${id}';draw()"><span class="src">${s}</span>${n}</button>`).join('')}</div>
    <div class="card pad col">${S.src === 'jira' ? `<label class="field"><span>Jira site</span><input class="input" value="https://nordlys.atlassian.net"></label><div class="row wrap"><label class="field grow"><span>Email</span><input class="input" value="mette@contoso.dk"></label><label class="field grow"><span>API token</span><input class="input" type="password" value="•••••••••••••••••"></label></div>`
      : S.src === 'ado' ? `<label class="field"><span>Organization URL</span><input class="input" value="${D.source.url}"></label><label class="field"><span>Personal access token</span><input class="input" type="password" value="•••••••••••••••••••••"><small>Work Items (Read), Project and Team (Read). <a href="#" onclick="return false">Where to get one</a></small></label>`
      : `<p class="mute">This prototype walks through Azure DevOps and Jira. Pick one of those.</p>`}
      <div class="row"><button class="btn primary" ${['ado', 'jira'].includes(S.src) ? '' : 'disabled'} onclick="S.connected=true;draw()">Connect</button><span class="sm mute">Encrypted; deleted when you finish the migration.</span></div></div>`;
}
function readyView() {
  const c = cur();
  const needsEffort = !S.factor && !S.noEffort;
  return `<div class="hero"><span class="xs mute">Connected · read in 6 s</span><p class="sentence">Kupro will import ${c.sentence}.</p>
      <p class="sm mute">Keys stay: ${S.src === 'jira' ? 'PAY-123 stays PAY-123' : '#4567 becomes WEB-4567, and #4567 still finds it'}. People are matched by email, then name; the rest become placeholders with no seat.</p></div>
    <section class="card decide" aria-labelledby="d1"><h2 id="d1">${c.choiceTitle} <span class="chip acc">your team decides</span></h2>
      <p class="sm mute">Neither option is wrong. It depends on whether your top level is long-running goals (fold them into labels) or deliverables you plan by (keep them).</p>${c.choice}</section>
    <section class="card decide" aria-labelledby="d2"><h2 id="d2">Story points <span class="chip ${needsEffort ? 'warn' : 'ok'}">${needsEffort ? 'needs an answer' : 'set'}</span></h2>
      <p class="sm">${c.est}. ${fmt(c.pointsOnly)} more only have story points. How many hours is one point?</p>
      <div class="row wrap"><input class="input mono" style="width:90px" placeholder="hours" value="${S.factor}" aria-label="Hours per point" oninput="S.factor=this.value;S.noEffort=false;softDraw()"><span class="mute">or</span>
        <label class="check"><input type="checkbox" ${S.noEffort ? 'checked' : ''} onchange="S.noEffort=this.checked;S.factor='';draw()"> Import them without effort</label></div></section>
    <section class="col" aria-label="Everything else"><div class="row"><h2 class="grow">Everything else uses defaults</h2><button class="btn" onclick="openDrawer()">${icon('sliders')} Adjust <kbd>A</kbd></button></div>
      <div class="card pad defaults">${(S.src === 'jira' ? [['Types', 'Story, Task → Task · Bug → Task + bug · Sub-task → Task'], ['States', 'By status category; "In QA" → In Review, "Won\'t do" → Canceled'], ['People', `${J.matched} matched · ${J.placeholders} placeholders · 2 bots skipped`], ['Fields', 'Labels and Components → labels · versions with a date → milestones'], ['Sprints', '41 sprints with dates']]
        : [['Projects', 'Webshop → WEB, Mobile App → MOB, Platform → PLAT · Legacy CRM left out (no changes since 2024)'], ['Types', 'Agile and Scrum defaults · Bug → Task + bug · test items skipped'], ['States', 'By category; Code Review → In Review'], ['People', '18 matched · 4 placeholders · build service skipped'], ['Fields', 'Area Path, Tags → labels · iterations → sprints']])
        .map(([k, v]) => `<span class="k">${k}</span><span class="trunc">${v}</span><button class="btn sm ghost" onclick="openDrawer('${k.toLowerCase()}')">Change</button>`).join('')}</div>
      ${S.edits ? `<span class="sm edited">${S.edits} change${S.edits > 1 ? 's' : ''} from defaults</span>` : ''}</section>
    <div class="cta"><button class="btn primary" ${needsEffort ? 'disabled' : ''} onclick="run()">Import ${fmt(c.issues)} issues</button>
      <span class="sm mute">${needsEffort ? 'Answer the story points question first.' : 'You can undo the whole import until you finish the migration.'}</span><span class="grow"></span><button class="btn ghost sm" onclick="toast('Shows the dry run: counts per project, re-parented items, conflicts, attachments.')">See the full plan</button></div>`;
}
function runView() {
  const c = cur();
  if (S.phase === 'run') return `<div class="hero"><span class="display">Importing</span><p class="mute">${phaseAt(S.pct)} · ${fmt(Math.round(S.pct * c.issues))} of ${fmt(c.issues)}</p></div><div class="bar"><i style="width:${S.pct * 100}%"></i></div><p class="sm mute">You can leave this page. Kupro emails you when it's done.</p>`;
  return `<div class="hero"><span class="display">Your work is in Kupro</span><p class="mute md">${fmt(c.issues)} issues, 0 conflicts. Your team can keep working in the old tool for now: Kupro picks up their changes every hour, and edits made in Kupro win.</p></div>
    <div class="row wrap">${(S.src === 'jira' ? [['PAY', 'Payments']] : perProject(S.fold).map((p) => [p.key, p.name])).map(([k, n]) => `<a class="btn" href="#" onclick="return false"><span class="mono mute">${k}</span> Open ${n}</a>`).join('')}</div>
    <div class="card pad col"><label class="check"><input type="checkbox" checked> Sync every hour until I finish the migration</label><div class="row wrap"><button class="btn" onclick="toast('Sync started')">${icon('refresh')} Sync now</button><button class="btn danger" onclick="toast('Undo confirm dialog')">Undo import</button><span class="grow"></span><button class="btn" onclick="toast('Finish migration confirm dialog')">${icon('flag')} Finish migration</button></div></div>`;
}
function drawer() {
  if (!S.drawer) return '';
  const tabs = ['projects', 'types', 'states', 'people', 'fields'];
  const ed = () => `onchange="S.edits++"`;
  const body = {
    projects: () => `<div class="card" style="overflow:hidden"><table class="t"><tbody>${D.projects.map((p) => `<tr><td><input type="checkbox" ${p.on ? 'checked' : ''} ${ed()} aria-label="Import ${p.name}"></td><td>${p.name}</td><td class="mute">${p.process}</td><td class="num">${fmt(p.items)}</td><td><input class="input mono" style="width:70px" value="${p.key}" ${ed()} aria-label="Key"></td></tr>`).join('')}</tbody></table></div>`,
    types: () => `<div class="card" style="overflow:hidden"><table class="t"><thead><tr><th>Type</th><th class="num">Items</th><th>Kupro</th></tr></thead><tbody>${D.types.map((t) => `<tr><td>${t.src}</td><td class="num">${fmt(t.n)}</td><td><span ${ed()}>${typeSelect(foldType(t, S.fold), t.src)}</span></td></tr>`).join('')}</tbody></table></div><p class="xs mute">Hierarchy is on the main page: it's a team decision, not a detail.</p>`,
    states: () => `<div class="card" style="overflow:hidden"><table class="t"><thead><tr><th>State</th><th class="num">Items</th><th>Kupro</th></tr></thead><tbody>${D.states.map((s) => `<tr><td>${s.src} <span class="xs mute">${s.cat}</span></td><td class="num">${fmt(s.n)}</td><td><span ${ed()}>${stateSelect(s.to, s.src)}</span></td></tr>`).join('')}</tbody></table></div>`,
    people: () => `<div class="card" style="overflow:hidden"><table class="t"><tbody>${D.people.map((p, i) => `<tr><td><div class="row">${av(p.name, !p.member)}<span>${p.name}</span></div></td><td>${matchChip(p)}</td><td><span ${ed()}>${peopleSelect(p, i)}</span></td></tr>`).join('')}</tbody></table></div>`,
    fields: () => `<div class="col">${D.fields.map((f) => `<label class="check"><input type="checkbox" ${f.on ? 'checked' : ''} ${ed()}> ${f.src} → ${f.to} <span class="sm mute">${f.note || ''}</span></label>`).join('')}</div><p class="sm mute">Unticked fields go into an "Imported from Azure DevOps" block in the description.</p>`,
  }[S.tab];
  return `<div class="scrim" onclick="closeDrawer()"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Adjust the mapping"><header><h2 class="grow">Adjust the mapping</h2><button class="btn ghost sm" onclick="closeDrawer()" aria-label="Close">${icon('x', 14)}</button></header>
    <div class="tabs" role="tablist">${tabs.map((t) => `<button role="tab" aria-selected="${S.tab === t}" onclick="S.tab='${t}';redrawer()">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div><div class="bd">${body()}</div></div>`;
}
let lastFocus;
function openDrawer(tab) { lastFocus = document.activeElement; if (tab && ['projects', 'types', 'states', 'people', 'fields'].includes(tab)) S.tab = tab; S.drawer = 1; redrawer(); $('.drawer [aria-selected="true"]').focus(); }
function closeDrawer() { S.drawer = null; redrawer(); draw(); lastFocus && lastFocus.focus(); }
function redrawer() { $('#drawerHost').innerHTML = drawer(); }
function softDraw() { const a = document.activeElement; const id = a && a.getAttribute('aria-label'); draw(); if (id) { const el = $(`#app [aria-label="${id}"]`); if (el) { el.focus(); if (el.setSelectionRange) el.setSelectionRange(el.value.length, el.value.length); } } }
function draw() { $('#app').innerHTML = !S.connected ? connectView() : S.phase === 'ready' ? readyView() : runView(); }
function run() { S.phase = 'run'; draw(); simulate((p) => { S.pct = p; draw(); }, () => { S.phase = 'done'; $('#side').innerHTML = sidebar(S.src === 'jira' ? [{ name: 'Payments', key: 'PAY', color: 'ochre' }] : IMPORTED_PROJECTS); draw(); }); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.drawer) closeDrawer(); if (e.key.toLowerCase() === 'a' && S.connected && S.phase === 'ready' && !S.drawer && !e.target.matches('input, select, textarea')) { e.preventDefault(); openDrawer(); } });
draw();
</script>
</body>
</html>
