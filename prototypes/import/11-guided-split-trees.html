<title>Import · 11 Guided split pane with trees · Kupro prototype</title>
<style>
/* Kobber tokens, copied from web/src/styles/tokens.css (docs/design-guide.md). Light by default; the
   prototype bar's theme button sets data-theme="dark". Fonts fall back to system faces: no web fonts here. */
:root {
  color-scheme: light;
  --bg: #f2f4f3; --panel: #ffffff; --sunk: #e7ecea; --line: #d3dbd8; --ink: #16201d; --mute: #56655f;
  --acc: #2c7a6a; --acc-ink: #246859; --on-acc: #ffffff; --side: #1c2a26; --side-ink: #cfe0da;
  --prog: #b5651f; --rev: #6553a8; --ok: #3f8a3c; --warn: #a9801a; --bad: #b3393b;
  --proj-verdigris: #2c7a6a; --proj-copper: #b5651f; --proj-plum: #6553a8; --proj-moss: #3f8a3c;
  --proj-ochre: #a9801a; --proj-brick: #b3393b; --proj-slate: #56708a; --proj-fjord: #2f6f9f;
  --sel: color-mix(in srgb, var(--acc) 13%, transparent);
  --side-sel: color-mix(in srgb, var(--side-ink) 11%, transparent);
  --font-display: 'Bricolage Grotesque Variable', system-ui, sans-serif;
  --font-ui: 'Hanken Grotesk Variable', system-ui, sans-serif;
  --font-mono: 'Fragment Mono', ui-monospace, Consolas, monospace;
  --r1: 5px; --r2: 7px; --row: 34px; --nav-item: 28px; --topbar: 48px; --control: 30px; --sidebar: 212px;
  --shadow-float: 0 24px 60px -12px rgb(0 0 0 / 0.45);
  --scrim: rgb(0 0 0 / 0.35);
  --ease: cubic-bezier(0.2, 0, 0, 1); --dur-1: 120ms; --dur-2: 160ms;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0f1514; --panel: #161f1d; --sunk: #0b100f; --line: #25322e; --ink: #e2ece8; --mute: #8fa29b;
  --acc: #5bb8a3; --acc-ink: #6cc4af; --on-acc: #08130f; --side: #0b100f; --side-ink: #b7cac3;
  --prog: #e08e52; --rev: #a194e6; --ok: #78c36f; --warn: #e3bc55; --bad: #ee6e6e;
  --proj-verdigris: #5bb8a3; --proj-copper: #e08e52; --proj-plum: #a194e6; --proj-moss: #78c36f;
  --proj-ochre: #e3bc55; --proj-brick: #ee6e6e; --proj-slate: #93a9c0; --proj-fjord: #6faedc;
}
@media (prefers-reduced-motion: reduce) { :root { --dur-1: 0ms; --dur-2: 0ms; } }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 18px;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
a { color: var(--acc-ink); }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; }
h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.display { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; }
.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.mute { color: var(--mute); }
.sm { font-size: 12px; line-height: 16px; }
.xs { font-size: 11px; line-height: 16px; }
.md { font-size: 14px; line-height: 22px; }
.strong { font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; color: var(--mute); background: var(--panel); }

/* ---------- Prototype bar ---------- */
.proto { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: var(--sunk);
  border-bottom: 1px dashed var(--line); font-size: 12px; color: var(--mute); flex: none; }
.proto b { color: var(--ink); }
.proto .sp { flex: 1; }
.proto button { background: none; border: 1px solid var(--line); border-radius: var(--r1); padding: 1px 8px; cursor: pointer; color: var(--mute); }

/* ---------- Shell ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: var(--sidebar); flex: none; background: var(--side); color: var(--side-ink); padding: 8px;
  display: flex; flex-direction: column; gap: 16px; }
.side .ws { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; font-weight: 600; }
.side .nav { display: flex; flex-direction: column; gap: 2px; }
.side .ni { display: flex; align-items: center; gap: 8px; height: var(--nav-item); padding: 0 8px; border-radius: var(--r1);
  color: var(--side-ink); text-decoration: none; }
.side .ni:hover { background: var(--side-sel); }
.side .ni[aria-current='page'] { background: var(--side-sel); font-weight: 600; }
.side kbd { background: transparent; color: inherit; border-color: var(--side-sel); }
.side .ni .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: .6; }
.side .hd { padding: 0 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .6; }
.side .sq { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.side .sfoot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 12px; opacity: .85; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.topbar { height: var(--topbar); flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px;
  border-bottom: 1px solid var(--line); background: var(--bg); }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--mute); }
.crumb b { color: var(--ink); font-weight: 600; }
.content { flex: 1; overflow: auto; min-height: 0; }
@media (max-width: 640px) { .side { display: none; } }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: var(--control); padding: 0 12px; border-radius: var(--r1);
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap;
  transition: background var(--dur-1) var(--ease); text-decoration: none; }
.btn:hover { background: var(--sel); }
.btn.primary { background: var(--acc); border-color: var(--acc); color: var(--on-acc); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.primary kbd { background: transparent; color: var(--on-acc); border-color: color-mix(in srgb, var(--on-acc) 45%, transparent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--mute); }
.btn.ghost:hover { color: var(--ink); background: var(--sel); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.input, select.input { height: var(--control); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r1);
  background: var(--panel); min-width: 0; }
select.input { padding-right: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; }
.field > small { font-size: 12px; color: var(--mute); }
.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r1); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; color: var(--mute); }
.seg button[aria-pressed='true'] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--acc); }
.check input { accent-color: var(--acc); width: 14px; height: 14px; margin: 0; }

/* ---------- Surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.pad { padding: 16px; }
.sunk { background: var(--sunk); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
.float { box-shadow: var(--shadow-float); }

/* ---------- Tags, chips, pills, avatars ---------- */
.tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: var(--r1); font-size: 12px;
  font-weight: 600; flex: none; }
.tag.epic { color: var(--rev); background: color-mix(in srgb, var(--rev) 14%, transparent); }
.tag.feature { color: var(--acc-ink); background: color-mix(in srgb, var(--acc-ink) 14%, transparent); }
.tag.task { color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r1);
  font-size: 11px; font-weight: 600; flex: none; color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip.ok { color: var(--ink); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.ok::before { content: '✓'; color: var(--ok); }
.chip.warn { color: var(--ink); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.warn::before { content: '!'; color: var(--warn); font-weight: 700; }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.chip.bad::before { content: '×'; }
.chip.acc { color: var(--acc-ink); background: var(--sel); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 8px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 11px; color: var(--mute); flex: none; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
.pill.bug::before { background: var(--bad); }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: var(--on-acc); flex: none; }
.av.ph { background: transparent !important; border: 1px dashed var(--mute); color: var(--mute); }
.av.agent { border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); }
.ring { flex: none; }
.src { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r1);
  background: var(--sunk); border: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; font-weight: 600; flex: none; }
.src.lg { width: 40px; height: 40px; font-size: 12px; border-radius: var(--r2); }
.warnline { color: var(--ink); display: flex; gap: 6px; align-items: flex-start; }
.warnline::before { content: '!'; flex: none; width: 14px; height: 14px; border-radius: 3px; background: var(--warn); color: var(--panel);
  font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.okline { display: flex; gap: 6px; align-items: flex-start; }
.okline::before { content: '✓'; color: var(--ok); font-weight: 700; flex: none; }

/* ---------- Tables ---------- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 0 12px; height: 30px;
  background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--acc) 6%, transparent); }
table.t .num, table.t th.num { text-align: right; }
table.t th.num { font-family: inherit; }
.arrow { color: var(--mute); }

/* ---------- Progress ---------- */
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 20px; line-height: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--mute); }

/* ---------- Toast ---------- */
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); border-radius: var(--r2);
  padding: 10px 14px; font-size: 12px; box-shadow: var(--shadow-float); max-width: 380px; z-index: 50; }

/* ---------- Fold choice: two equal options ---------- */
.foldopts { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.foldopts legend { font-weight: 600; font-size: 14px; padding: 0 0 8px; }
.foldopt { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r2); background: var(--panel); cursor: pointer; min-width: 0; }
.foldopt:hover { border-color: var(--acc-ink); }
.foldopt:has(input:checked) { border-color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc-ink); }
.foldopt:has(input:focus-visible) { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
.foldopt:has(input:disabled) { cursor: default; }
.foldopt .fmap { display: grid; grid-template-columns: auto 14px 1fr; gap: 2px 6px; font-size: 12px; }
.foldopt .fmap .fl { color: var(--rev); font-weight: 600; }
.foldopt .fcount { font-size: 12px; }
.foldopt .fline { font-size: 12px; line-height: 16px; }
.foldopt .fline b { font-weight: 600; margin-right: 4px; }
@media (max-width: 720px) { .foldopts { grid-template-columns: 1fr; } }

/* ---------- 11: split pane, guided steps, hierarchy trees ---------- */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; min-height: 0; }
.left { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.lbody { flex: 1; overflow: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px; container-type: inline-size; }
.right { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.tblcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; }

/* Stepper: numbered, done = check, needs a decision = !, current = filled accent. */
.stepbar { flex: none; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--bg); overflow-x: auto; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; }
.steps li { display: flex; align-items: center; flex: none; }
.steps li + li::before { content: ''; width: 14px; height: 1px; background: var(--line); margin: 0 2px; }
.steps li.done::before { background: var(--ok); }
.steps button { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border: 0; background: none;
  border-radius: 999px; cursor: pointer; color: var(--mute); white-space: nowrap; }
.steps button:hover:not(:disabled) { background: var(--sel); color: var(--ink); }
.steps button:disabled { cursor: default; opacity: .55; }
.steps .n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-flex; align-items: center;
  justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; flex: none; }
.steps li.done .n { border-color: var(--ok); color: var(--ok); }
.steps li.attn .n { border-color: var(--warn); color: var(--ink); background: color-mix(in srgb, var(--warn) 18%, transparent); }
.steps li.done button, .steps li.attn button { color: var(--ink); }
.steps li button[aria-current='step'] { color: var(--ink); font-weight: 600; background: var(--sel); }
.steps li button[aria-current='step'] .n { background: var(--acc); border-color: var(--acc); color: var(--on-acc); }

/* Footer: the one primary action, what comes next, and why it is blocked. */
.foot { flex: none; position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel); }
.foot .fprog { position: absolute; left: 0; right: 0; top: -1px; height: 2px; background: transparent; }
.foot .fprog i { display: block; height: 100%; background: var(--acc); transition: width var(--dur-2) var(--ease); }
.foot .msg { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.foot .btn.primary { height: 34px; padding: 0 16px; }
@keyframes nudge { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.nudge { animation: nudge 900ms var(--ease) 2; }
@media (prefers-reduced-motion: reduce) { .nudge { animation: none; } }

/* Source picker with product marks. Marks are rough stand-ins for the vendors' own logo files. */
.logo { width: 30px; height: 30px; border-radius: var(--r1); background: var(--panel); border: 1px solid var(--line); display: inline-flex;
  align-items: center; justify-content: center; flex: none; color: var(--ink); }
.logo svg { width: 18px; height: 18px; }
.logo.lg { width: 40px; height: 40px; border-radius: var(--r2); }
.logo.lg svg { width: 24px; height: 24px; }
.srcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.srcgrid button { display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: var(--r2);
  background: var(--panel); cursor: pointer; text-align: left; min-width: 0; }
.srcgrid button:hover:not(:disabled) { border-color: var(--acc-ink); }
.srcgrid button[aria-pressed='true'] { border-color: var(--acc-ink); box-shadow: inset 0 0 0 1px var(--acc-ink); background: var(--sel); }
.srcgrid button:disabled { cursor: not-allowed; background: var(--sunk); border-style: dashed; }
.srcgrid button:disabled .logo { filter: grayscale(1); opacity: .5; }
.srcgrid button:disabled b { color: var(--mute); }
.chip.wip { color: var(--mute); background: transparent; border: 1px solid var(--line); letter-spacing: .04em; margin-left: auto; }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r2); padding: 22px; text-align: center; color: var(--mute); background: var(--sunk); }

/* Open decisions box in the plan rail. */
.todo { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--panel));
  border-radius: var(--r2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.todo button { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: underline;
  text-decoration-color: var(--line); text-underline-offset: 3px; }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; align-items: center; }
.kv .v { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.kv .d { font-family: var(--font-mono); font-size: 11px; color: var(--acc-ink); min-width: 46px; text-align: right; }
.dist { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 1px; background: var(--sunk); }
.dist i { display: block; height: 100%; }
.preview { border: 1px solid var(--line); border-radius: var(--r1); }
.preview .r { display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 10px; border-bottom: 1px solid var(--line); }
.preview .r:last-child { border-bottom: 0; }
.preview .k { font-family: var(--font-mono); color: var(--mute); width: 66px; flex: none; font-size: 12px; }

/* Trees (from 07). */
.trees { display: grid; grid-template-columns: minmax(0, 1fr) 112px minmax(0, 1fr); align-items: stretch; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pane > header { height: 46px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--sunk); display: flex; align-items: center; gap: 8px; }
.pane .empty { padding: 24px 16px; color: var(--mute); text-align: center; margin: auto 0; }
.node { display: flex; align-items: center; gap: 6px; height: var(--row); padding-right: 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); position: relative; min-width: 0; }
.node:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: -2px; }
.node.hl { background: var(--sel); box-shadow: inset 2px 0 0 var(--acc-ink); }
.node .k { font-family: var(--font-mono); font-size: 12px; color: var(--mute); width: 66px; flex: none; }
.node .trunc { flex: 1; min-width: 0; }
.node .note { font-size: 11px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%; flex-shrink: 1; }
.node .note.w { color: var(--ink); background: color-mix(in srgb, var(--warn) 14%, transparent); padding: 0 6px; border-radius: var(--r1); }
.node .guide { width: 14px; flex: none; align-self: stretch; border-left: 1px solid var(--line); margin-left: 10px; }
.lvl { font-size: 11px; font-weight: 600; padding: 0 5px; height: 16px; display: inline-flex; align-items: center; border-radius: var(--r1); border: 1px solid var(--line); color: var(--mute); flex: none; }
.map { display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 8px; font-size: 12px; }
.map .r { display: grid; grid-template-columns: 1fr 12px 1fr; align-items: center; gap: 4px; text-align: center; }
.map .r .a { color: var(--mute); }
.map .r.fold .a, .map .r.fold span:last-child { color: var(--warn); font-weight: 600; }

/* Fake a running import: calls onTick(pct) and onDone(). */
function simulate(onTick, onDone, ms = 2600) {
  const start = performance.now();
  const step = (now) => {
    const pct = Math.min(1, (now - start) / ms);
    onTick(pct);
    if (pct < 1) requestAnimationFrame(step); else onDone && onDone();
  };
  requestAnimationFrame(step);
}

  const by = { Epic: 0, Feature: 0, Task: 0, Skip: 0, Label: 0 };

    <div class="legend"><span><span class="note w" style="padding:0 6px;border-radius:5px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink)">highlighted</span> changed parent or type, keeps a relates link</span><span>Numbers stay: #4571 → WEB-4571</span></div>`,
  types: () => `${head('Types', `Defaults come from each process's backlog levels. ${S.fold ? `Rows set by <b>${FOLD[S.fold].name}</b> follow the Hierarchy step.` : 'Pick a hierarchy first; it sets some of these rows.'}`)}
    <div class="tblcard"><table class="t"><thead><tr><th>Work item type</th><th>Level</th><th class="num">Items</th><th>Kupro type</th></tr></thead><tbody>${D.types.map((t, i) => `<tr><td>${t.src}${t.label ? ` <span class="pill bug">${t.label}</span>` : ''}</td><td class="mute">${t.level}</td><td class="num">${fmt(t.n)}</td><td>${S.fold === 'epics' && foldType(t, 'epics') !== t.to ? `<span class="row">${foldType(t, 'epics') === 'Label' ? '<span class="tag epic">Epic</span> + label' : typeCell(foldType(t, 'epics'))}<span class="xs mute">set by hierarchy</span></span>` : `<span data-k="types" data-i="${i}">${typeSelect(S.types[i], t.src)}</span>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="sm mute">Shown: Webshop and Mobile App (Agile). Platform (Scrum) has its own rows.</p>`,
  states: () => `${head('States', 'Mapped by each state\'s category. Change any row; the plan on the right updates.')}
    <div class="tblcard"><table class="t"><thead><tr><th>State</th><th>Category</th><th class="num">Items</th><th>Kupro state</th><th>Why</th></tr></thead><tbody>${D.states.map((s, i) => `<tr><td>${s.src}</td><td class="mute">${s.cat}</td><td class="num">${fmt(s.n)}</td><td data-k="states" data-i="${i}">${stateSelect(S.states[i], s.src)}</td><td class="sm mute">${s.why}</td></tr>`).join('')}</tbody></table></div>`,
  people: () => `${head('People', 'Matched by email first, then by name. Check the name matches; placeholders can be invited later.')}
    <div class="tblcard"><table class="t"><thead><tr><th>Person</th><th class="num">Items</th><th>Match</th><th>In Kupro</th></tr></thead><tbody>${D.people.map((p, i) => `<tr><td><div class="row">${av(p.name, !p.member)}<span>${p.name}</span></div></td><td class="num">${fmt(p.n)}</td><td>${matchChip(p)}</td><td data-k="people" data-i="${i}">${peopleSelect({ ...p, action: S.people[i] }, i)}</td></tr>`).join('')}</tbody></table></div>`,
  fields: () => `${head('Fields', 'Pick which fields become labels, sprints or text. The rest go into a details block on each issue.')}
    <div class="tblcard"><table class="t"><thead><tr><th></th><th>Field</th><th class="num">Items</th><th>Becomes</th></tr></thead><tbody>${D.fields.map((f, i) => `<tr><td><input type="checkbox" data-k="fields" data-i="${i}" ${S.fields[i] ? 'checked' : ''} aria-label="Use ${f.src}"></td><td>${f.src} <span class="xs mute">${f.note || ''}</span></td><td class="num">${fmt(f.n)}</td><td>${S.fields[i] ? f.to : 'details block'}</td></tr>`).join('')}</tbody></table></div>`,
  effort: () => `${head('Effort', 'Webshop: 3,040 items have an Original Estimate (15,210 h). 630 have story points only, and points have no safe conversion.')}
    <label class="field"><span>Hours per story point</span><input class="input mono" style="width:120px" inputmode="decimal" placeholder="e.g. 6" value="${S.factor}" id="factor" ${S.noEffort ? 'disabled' : ''}><small>No default: every team sizes points differently.</small></label>
    <label class="check"><input type="checkbox" id="noEffort" ${S.noEffort ? 'checked' : ''}> Import the 630 point-only items without effort</label>`,
  review: () => {
    const k = S.fold || 'tasks', f = D.plan[k], dash = (v) => (S.fold ? fmt(v) : '—'), c = calc();
    const row = (j, label, val, ok) => `<span class="strong">${label}</span><span class="${ok ? '' : 'warnline'}">${val}</span><button class="btn sm ghost" onclick="go(${j})">Change</button>`;
    return `${head('Review and import', 'The dry run for all 3 projects. Nothing is written until you import, and the first run can be undone.')}
    <div class="card pad decis">${row(2, 'Hierarchy', S.fold ? FOLD[S.fold].name : 'Not chosen', !!S.fold)}${row(7, 'Effort', S.noEffort ? 'Point-only items without effort' : S.factor ? `${S.factor} h per story point` : 'Not set', effortSet())}
      ${row(5, 'People', `${c.ph} placeholders, ${c.invites} invites, 1 skipped`, true)}${row(1, 'Projects', 'WEB, MOB, PLAT as new projects', true)}</div>
    <div class="card counts"><div class="stat"><b>${fmt(D.plan.issues)}</b><span>issues</span></div><div class="stat"><b>${dash(f.reparented)}</b><span>re-parented</span></div><div class="stat"><b>${c.ph}</b><span>placeholders</span></div><div class="stat"><b>${D.plan.bytes}</b><span>attachments</span></div></div>
    <div class="tblcard"><table class="t"><thead><tr><th>Project</th><th class="num">Epics</th><th class="num">Features</th><th class="num">Tasks</th><th class="num">Skipped</th></tr></thead><tbody>${perProject(k).map((p) => `<tr><td><span class="mono mute">${p.key}</span> ${p.name}</td><td class="num">${dash(p.epics)}</td><td class="num">${dash(p.features)}</td><td class="num">${dash(p.tasks)}</td><td class="num">${p.skipped}</td></tr>`).join('')}</tbody></table></div>
    <p class="sm mute">Also copied: ${fmt(D.plan.comments)} comments, ${fmt(D.plan.changes)} history entries, ${D.plan.sprints} sprints.</p>`;
  },
};

function runView() {
  const n = D.plan[S.fold].issues;
  if (S.phase === 'run') {
    const cur = PHASES.indexOf(phaseAt(S.pct));
    return `${head('Importing', 'You can close this tab; the run continues on the server.')}
      <div class="card pad col" style="max-width:640px"><div class="row"><b>${phaseAt(S.pct)}</b><span class="grow"></span><span class="mono">${fmt(Math.round(S.pct * n))} / ${fmt(n)}</span></div><div class="bar"><i style="width:${S.pct * 100}%"></i></div>
      <ol class="phases">${PHASES.map((p, i) => `<li class="${i < cur ? 'ok' : i === cur ? 'on' : ''}">${p}</li>`).join('')}</ol></div>`;
  }
  return `${head('Imported', '')}<span class="okline">${fmt(n)} issues in WEB, MOB and PLAT · 0 conflicts · ${calc().ph} placeholders</span>
    <div class="card pad col" style="max-width:640px;gap:12px"><h2>What happens next</h2>
      <p>This import now lives under <b>Settings → Import</b>: its runs, conflicts, placeholders to invite, Undo and Finish migration.</p>
      <label class="check"><input type="checkbox" checked> Sync from Azure DevOps every hour until you finish the migration</label>
      <div class="row wrap"><a class="btn primary" href="08-connections-dashboard.html">Open the import ${icon('arrow', 14)}</a><a class="btn" href="#" onclick="return false">Go to Webshop</a></div>
      <span class="xs mute">"Open the import" goes to prototype 08, the direction for life after the first run.</span></div>`;
}

/* ---------- Chrome: stepper, footer, plan rail ---------- */
function stepper() {
  return `<ol class="steps">${STEPS.map((s, i) => {
    const st = status(i), cur = i === S.step && S.phase === 'map';
    const n = cur ? i + 1 : st === 'done' ? '✓' : st === 'attn' ? '!' : i + 1;
    const sr = st === 'done' ? ', done' : st === 'attn' ? ', needs a decision' : st === 'locked' ? ', connect first' : '';
    return `<li class="${st}"><button type="button" ${cur ? 'aria-current="step"' : ''} ${st === 'locked' || S.phase !== 'map' ? 'disabled' : ''} onclick="go(${i})" aria-label="Step ${i + 1}, ${s.label}${sr}"><span class="n" aria-hidden="true">${n}</span>${s.label}</button></li>`;
  }).join('')}</ol>`;
}
function footer() {
  const i = S.step, nx = STEPS[i + 1], b = blocker(i);
  const doneCount = STEPS.filter((_, j) => status(j) === 'done').length;
  let primary, msg;
  if (i === 0 && !S.connected) {
    primary = `<button class="btn primary" id="primary" onclick="connect()">${FILE_SRC.includes(S.src) ? 'Upload' : 'Connect'} and continue ${icon('arrow', 14)}</button>`;
    msg = `<span class="trunc"><b>Next: ${nx.label}</b> <span class="mute">· ${nx.hint}</span></span>`;
  } else if (i === LAST) {
    const open = openDecisions();
    primary = `<button class="btn primary" id="primary" ${open.length ? 'disabled' : ''} onclick="run()">Import ${fmt(D.plan.issues)} issues</button>`;
    msg = open.length ? `<span class="warnline">${open.length} decision${open.length > 1 ? 's' : ''} left: ${open.map((j) => `<a href="#" onclick="go(${j});return false">${STEPS[j].label}</a>`).join(', ')}</span>`
      : '<span class="okline">Ready. This is exactly what the import writes.</span>';
  } else {
    primary = `<button class="btn primary" id="primary" ${b ? 'disabled' : ''} onclick="next()">Continue to ${nx.label} ${icon('arrow', 14)}</button>`;
    msg = b ? `<span class="warnline">${b}</span>` : `<span class="trunc"><b>Next: ${nx.label}</b> <span class="mute">· ${nx.hint}</span></span>`;
  }
  return `<div class="fprog" aria-hidden="true"><i style="width:${doneCount / STEPS.length * 100}%"></i></div>
    <button class="btn" ${i === 0 ? 'disabled' : ''} onclick="go(${i - 1})">Back</button>
    <div class="msg"><span class="xs mute">Step ${i + 1} of ${STEPS.length} · ${STEPS[i].label}</span><span class="sm" style="min-width:0">${msg}</span></div>
    <span class="xs mute kbdhint"><kbd>Ctrl</kbd> <kbd>Enter</kbd></span>${primary}`;
}
function right() {
  if (S.phase !== 'map') {
    const n = D.plan[S.fold].issues, done = S.phase === 'done';
    return `<h2>${done ? 'Run 1 complete' : 'Importing'}</h2><div class="row"><span class="sm">${done ? 'Imported' : phaseAt(S.pct)}</span><span class="grow"></span><span class="mono">${fmt(Math.round(S.pct * n))}</span></div><div class="bar"><i style="width:${S.pct * 100}%"></i></div>
      <span class="sm mute">${done ? 'Kupro keeps the source link until you finish the migration.' : 'Writing into new projects WEB, MOB and PLAT.'}</span>`;
  }
  if (!S.connected) return `<h2>Plan</h2><p class="mute">Connect a source to see a live dry run of what Kupro will create.</p>
    <div class="col sm mute" style="gap:4px"><span>Then, in ${STEPS.length - 1} short steps:</span>${STEPS.slice(1).map((s, i) => `<span>${i + 2}. ${s.label}</span>`).join('')}</div>`;
  const c = calc(), open = openDecisions();
  const d = (k) => { if (!prev || prev[k] === c[k]) return '<span class="d"></span>'; const x = c[k] - prev[k]; return `<span class="d">${x > 0 ? '+' : '−'}${fmt(Math.abs(x))}</span>`; };
  const v = (k) => (S.fold ? fmt(c[k]) : '—');
  const total = Object.values(c.st).reduce((a, b) => a + b, 0);
  const branch = !S.fold ? '<p class="sm mute">Pick a hierarchy to see how one branch lands.</p>' : `<div class="preview">${(S.fold === 'tasks'
    ? [['WEB-1203', 'Epic', 'Checkout redesign', 'In Progress', 0], ['WEB-3310', 'Feature', 'MobilePay and card payments', 'In Progress', 1], ['WEB-4567', '', 'As a shopper I can pay with MobilePay', 'In Progress', 2], ['WEB-4571', '', 'Add MobilePay SDK to checkout service', 'Done', 2, 'relates WEB-4567']]
    : [['WEB-1203', 'Epic', 'Checkout redesign', 'In Progress', 0, 'no children'], ['WEB-3310', 'Epic', 'MobilePay and card payments', 'In Progress', 0, 'label checkout-redesign'], ['WEB-4567', 'Feature', 'As a shopper I can pay with MobilePay', 'In Progress', 1], ['WEB-4571', '', 'Add MobilePay SDK to checkout service', 'Done', 2]])
    .map(([k, t, ti, s, dp, n]) => `<div class="r" style="padding-left:${10 + dp * 14}px">${ring(s)}<span class="k">${k}</span>${tag(t)}<span class="trunc grow">${ti}</span>${n ? `<span class="xs mute trunc">${n}</span>` : ''}</div>`).join('')}</div>`;
  return `<div class="row"><h2 class="grow">Plan</h2><select class="input" aria-label="Preview project" style="height:26px"><option>Webshop</option><option>All 3 projects</option></select></div>
    <span class="xs mute">Dry run, updates as you map. Δ = change from your last edit.</span>
    ${open.length ? `<div class="todo"><span class="sm strong">Needs you before import</span>${open.map((j) => `<button type="button" class="sm" onclick="go(${j})">${STEPS[j].label}: ${j === 2 ? 'Keep or Fold Epics' : 'hours per story point'}</button>`).join('')}</div>`
      : '<span class="okline sm">No open decisions</span>'}
    <div class="kv"><span>Issues</span><span class="v">${fmt(c.issues)}</span>${d('issues')}<span><span class="tag epic">Epic</span></span><span class="v">${v('epics')}</span>${d('epics')}
      <span><span class="tag feature">Feature</span></span><span class="v">${v('features')}</span>${d('features')}<span>Task</span><span class="v">${v('tasks')}</span>${d('tasks')}
      <span>Re-parented</span><span class="v">${v('reparented')}</span>${d('reparented')}<span>Skipped</span><span class="v">${fmt(c.skipped)}</span>${d('skipped')}
      <span>Placeholders</span><span class="v">${c.ph}</span>${d('ph')}<span>Invites on import</span><span class="v">${c.invites}</span>${d('invites')}
      <span>Labels</span><span class="v">${c.labels + c.labelsFromEpics}</span>${d('labels')}<span>Effort</span><span class="v">${fmt(c.effort)} h</span>${d('effort')}</div>
    <div class="col" style="gap:6px"><h3>States</h3><div class="dist" role="img" aria-label="State distribution">${STATES.map((s) => `<i style="width:${c.st[s] / total * 100}%;background:${STATE_COLOR[s]}" title="${s}: ${fmt(c.st[s])}"></i>`).join('')}</div>
      <div class="row wrap" style="gap:4px 12px">${STATES.map((s) => `<span class="row xs" style="gap:4px">${ring(s)}${s} <span class="mono mute">${fmt(c.st[s])}</span></span>`).join('')}</div></div>
    ${STEPS[S.step].id === 'hierarchy' ? '' : `<div class="col" style="gap:6px"><h3>How one branch lands</h3>${branch}</div>`}
    ${S.step < LAST ? `<button class="btn" style="align-self:flex-start" onclick="go(${LAST})">Skip to review</button>` : ''}`;
}
function chrome() {
  const src = S.connected || S.phase !== 'map' ? 'ado' : S.src;
  $('#crumb').innerHTML = `Settings / Import / ${logo(src)}<b>${S.connected ? 'Contoso (Azure DevOps)' : `New import from ${srcName()}`}</b>`;
  $('#steps').innerHTML = stepper();
  $('#foot').innerHTML = S.phase === 'map' ? footer() : '';
  $('#foot').classList.toggle('hidden', S.phase !== 'map');
  $('#right').innerHTML = right();
}
function draw() { $('#lbody').innerHTML = S.phase === 'map' ? VIEWS[STEPS[S.step].id]() : runView(); chrome(); }
function go(i) {
  if (status(i) === 'locked' || S.phase !== 'map') return;
  S.step = i; prev = null; draw(); $('#lbody').scrollTop = 0; $('#stepH')?.focus();
}
function next() { if (blocker(S.step)) return; S.seen.add(S.step); go(S.step + 1); }
function pick(id) { S.src = id; draw(); }
function connect() {
  if (S.src !== 'ado') toast(`Prototype: the ${srcName()} form works the same way. The rest of this mock uses the Azure DevOps sample.`);
  S.src = 'ado'; S.connected = true; S.seen.add(0); go(1);
}
/* After a change: re-render the chrome and, if this step just stopped blocking, nudge Continue. */
function changed(wasBlocked) {
  chrome(); $('#saved').textContent = 'Mapping saved · just now';
  if (wasBlocked && !blocker(S.step)) $('#primary')?.classList.add('nudge');
}
function setFold(k) { const was = blocker(S.step); prev = calc(); S.fold = k; $('#lbody').innerHTML = VIEWS[STEPS[S.step].id](); changed(was); $('.foldopt input:checked')?.focus(); }
function run() { if (openDecisions().length) return; S.phase = 'run'; draw(); simulate((p) => { S.pct = p; draw(); }, () => { S.phase = 'done'; S.pct = 1; $('#side').innerHTML = sidebar(IMPORTED_PROJECTS); draw(); $('#stepH')?.focus(); }); }

document.addEventListener('change', (e) => {
  if (e.target.id === 'noEffort') {
    const was = blocker(S.step); prev = calc(); S.noEffort = e.target.checked; if (S.noEffort) S.factor = '';
    $('#lbody').innerHTML = VIEWS.effort(); changed(was); $('#noEffort').focus(); return;
  }
  const host = e.target.closest('[data-k]') || (e.target.dataset.k ? e.target : null); if (!host) return;
  prev = calc(); const k = host.dataset.k, i = +host.dataset.i;
  if (k === 'fields') S.fields[i] = e.target.checked;
  else if (k === 'people') S.people[i] = e.target.value.startsWith('m:') ? 'member' : e.target.value;
  else S[k][i] = e.target.value;
  if (k === 'fields') { $('#lbody').innerHTML = VIEWS.fields(); $(`[data-k="fields"][data-i="${i}"]`).focus(); }
  changed(false);
});
document.addEventListener('input', (e) => { if (e.target.id === 'factor') { const was = blocker(S.step); prev = calc(); S.factor = e.target.value; changed(was); } });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { const b = $('#primary'); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
});
const hl = (id, on) => $$(`.node[data-id="${id}"]`).forEach((n) => n.classList.toggle('hl', on));
['mouseover', 'focusin'].forEach((ev) => document.addEventListener(ev, (e) => { const n = e.target.closest?.('.node[data-id]'); $$('.node.hl').forEach((x) => x.classList.remove('hl')); if (n) hl(n.dataset.id, true); }));
draw();
</script>
</body>
</html>
