/* Kobber tokens, copied from web/src/styles/tokens.css (docs/design-guide.md). Light by default; the

:root {

  --proj-verdigris: #2c7a6a; --proj-copper: #b5651f; --proj-plum: #6553a8; --proj-moss: #3f8a3c;
  --proj-ochre: #a9801a; --proj-brick: #b3393b; --proj-slate: #56708a; --proj-fjord: #2f6f9f;
  --sel: color-mix(in srgb, var(--acc) 13%, transparent);
  --side-sel: color-mix(in srgb, var(--side-ink) 11%, transparent);
  --font-display: 'Bricolage Grotesque Variable', system-ui, sans-serif;
  --font-ui: 'Hanken Grotesk Variable', system-ui, sans-serif;
  --font-mono: 'Fragment Mono', ui-monospace, Consolas, monospace;
  --r1: 5px; --r2: 7px; --row: 34px; --nav-item: 28px; --topbar: 48px; --control: 30px; --sidebar: 212px;
  --shadow-float: 0 24px 60px -12px rgb(0 0 0 / 0.45);
  --scrim: rgb(0 0 0 / 0.35);
  --ease: cubic-bezier(0.2, 0, 0, 1); --dur-1: 120ms; --dur-2: 160ms;
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --bg: #0f1514; --panel: #161f1d; --sunk: #0b100f; --line: #25322e; --ink: #e2ece8; --mute: #8fa29b;
  --acc: #5bb8a3; --acc-ink: #6cc4af; --on-acc: #08130f; --side: #0b100f; --side-ink: #b7cac3;
  --prog: #e08e52; --rev: #a194e6; --ok: #78c36f; --warn: #e3bc55; --bad: #ee6e6e;
  --proj-verdigris: #5bb8a3; --proj-copper: #e08e52; --proj-plum: #a194e6; --proj-moss: #78c36f;
  --proj-ochre: #e3bc55; --proj-brick: #ee6e6e; --proj-slate: #93a9c0; --proj-fjord: #6faedc;

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 13px; line-height: 18px;
  -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acc-ink); outline-offset: 1px; }
a { color: var(--acc-ink); }
h1, h2, h3, h4, p { margin: 0; }
h1 { font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; }
h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
.display { font-family: var(--font-display); font-size: 28px; line-height: 32px; font-weight: 700; }
.mono, code { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
code { background: var(--sunk); padding: 0 4px; border-radius: 4px; font-size: 12px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.mute { color: var(--mute); }
.sm { font-size: 12px; line-height: 16px; }
.xs { font-size: 11px; line-height: 16px; }
.md { font-size: 14px; line-height: 22px; }
.strong { font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; }
.col { display: flex; flex-direction: column; gap: 8px; }

.wrap { flex-wrap: wrap; }

.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font-family: var(--font-mono); font-size: 11px; line-height: 16px; padding: 0 4px; border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; color: var(--mute); background: var(--panel); }

/* ---------- Prototype bar ---------- */
.proto { display: flex; align-items: center; gap: 12px; padding: 4px 12px; background: var(--sunk);

.proto b { color: var(--ink); }
.proto .sp { flex: 1; }
.proto button { background: none; border: 1px solid var(--line); border-radius: var(--r1); padding: 1px 8px; cursor: pointer; color: var(--mute); }

/* ---------- Shell ---------- */
.shell { flex: 1; display: flex; min-height: 0; }
.side { width: var(--sidebar); flex: none; background: var(--side); color: var(--side-ink); padding: 8px;
  display: flex; flex-direction: column; gap: 16px; }
.side .ws { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; font-weight: 600; }
.side .nav { display: flex; flex-direction: column; gap: 2px; }

  color: var(--side-ink); text-decoration: none; }
.side .ni:hover { background: var(--side-sel); }
.side .ni[aria-current='page'] { background: var(--side-sel); font-weight: 600; }

.side .ni .k { margin-left: auto; font-family: var(--font-mono); font-size: 11px; opacity: .6; }

/* ---------- Controls ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; height: var(--control); padding: 0 12px; border-radius: var(--r1);

.btn:hover { background: var(--sel); }

.btn.ghost:hover { color: var(--ink); background: var(--sel); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }

.input, select.input { height: var(--control); padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r1);

select.input { padding-right: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; font-weight: 600; }
.field > small { font-size: 12px; color: var(--mute); }
.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r1); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 4px; cursor: pointer; color: var(--mute); }

.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
input[type=checkbox], input[type=radio] { accent-color: var(--acc); }
.check input { accent-color: var(--acc); width: 14px; height: 14px; margin: 0; }

/* ---------- Surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r2); }
.pad { padding: 16px; }
.sunk { background: var(--sunk); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- Tags, chips, pills, avatars ---------- */
.tag { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: var(--r1); font-size: 12px;

.tag.epic { color: var(--rev); background: color-mix(in srgb, var(--rev) 14%, transparent); }
.tag.feature { color: var(--acc-ink); background: color-mix(in srgb, var(--acc-ink) 14%, transparent); }

.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: var(--r1);
  font-size: 11px; font-weight: 600; flex: none; color: var(--mute); background: color-mix(in srgb, var(--mute) 14%, transparent); }
.chip.ok { color: var(--ink); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.ok::before { content: '✓'; color: var(--ok); }
.chip.warn { color: var(--ink); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.chip.warn::before { content: '!'; color: var(--warn); font-weight: 700; }
.chip.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.chip.bad::before { content: '×'; }
.chip.acc { color: var(--acc-ink); background: var(--sel); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 19px; padding: 0 8px; border: 1px solid var(--line);
  border-radius: 999px; font-size: 11px; color: var(--mute); flex: none; }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
.pill.bug::before { background: var(--bad); }
.av { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 600; color: var(--on-acc); flex: none; }
.av.ph { background: transparent !important; border: 1px dashed var(--mute); color: var(--mute); }
.av.agent { border-radius: 6px; background: var(--ink); color: var(--bg); font-family: var(--font-mono); }
.ring { flex: none; }
.src { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r1);

.src.lg { width: 40px; height: 40px; font-size: 12px; border-radius: var(--r2); }
.warnline { color: var(--ink); display: flex; gap: 6px; align-items: flex-start; }
.warnline::before { content: '!'; flex: none; width: 14px; height: 14px; border-radius: 3px; background: var(--warn); color: var(--panel);
  font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.okline { display: flex; gap: 6px; align-items: flex-start; }
.okline::before { content: '✓'; color: var(--ok); font-weight: 700; flex: none; }

/* ---------- Tables ---------- */
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; color: var(--mute); padding: 0 12px; height: 30px;
  background: var(--sunk); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: color-mix(in srgb, var(--acc) 6%, transparent); }
table.t .num, table.t th.num { text-align: right; }
table.t th.num { font-family: inherit; }
.arrow { color: var(--mute); }

/* ---------- Progress ---------- */
.bar { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc); border-radius: 3px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 20px; line-height: 26px; font-weight: 400; font-variant-numeric: tabular-nums; }

/* ---------- Toast ---------- */
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--bg); border-radius: var(--r2);
  padding: 10px 14px; font-size: 12px; box-shadow: var(--shadow-float); max-width: 380px; z-index: 50; }

.foldopts { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }

.foldopt:has(input:disabled) { cursor: default; }
.foldopt .fmap { display: grid; grid-template-columns: auto 14px 1fr; gap: 2px 6px; font-size: 12px; }
.foldopt .fmap .fl { color: var(--rev); font-weight: 600; }
.foldopt .fcount { font-size: 12px; }
.foldopt .fline { font-size: 12px; line-height: 16px; }
.foldopt .fline b { font-weight: 600; margin-right: 4px; }
@media (max-width: 720px) { .foldopts { grid-template-columns: 1fr; } }

.wrapc { padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 16px; max-width: 1180px; }
.conn { display: grid; grid-template-columns: 40px minmax(0, 1.3fr) minmax(0, 1fr) 190px auto; gap: 14px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }

.spark .b i { display: block; border-radius: 1px; }
.spark .c { background: var(--acc); } .spark .u { background: color-mix(in srgb, var(--mute) 55%, transparent); } .spark .x { background: var(--bad); }

.drawer header { display: flex; align-items: center; gap: 8px; padding: 0 16px; height: var(--topbar); border-bottom: 1px solid var(--line); }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 39; }
.srcs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.srcs button { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r1); background: var(--panel); cursor: pointer; text-align: left; }
.srcs button[aria-pressed='true'] { border-color: var(--acc-ink); background: var(--sel); }
@media (max-width: 960px) { .conn { grid-template-columns: 40px 1fr; } .conn .hide-s { display: none; } .detail { grid-template-columns: 1fr; } }
</style>

/* Fake a running import: calls onTick(pct) and onDone(). */
function simulate(onTick, onDone, ms = 2600) {
  const start = performance.now();
  const step = (now) => {
    const pct = Math.min(1, (now - start) / ms);
    onTick(pct);
    if (pct < 1) requestAnimationFrame(step); else onDone && onDone();
  };
  requestAnimationFrame(step);
}

  { id: 'ado', short: 'ADO', name: 'Contoso', src: 'Azure DevOps Services · dev.azure.com/contoso', status: 'Syncing hourly', chip: 'ok', projects: 'WEB, MOB, PLAT', issues: 9049, last: '12 min ago', next: '15:00' },
  { id: 'trello', short: 'TRL', name: 'Marketing site', src: 'Trello board', status: 'Needs mapping', chip: 'warn', projects: 'MKT', issues: 0, last: 'never', next: '' },
  { id: 'jira', short: 'JRA', name: 'Payments', src: 'Jira Cloud · nordlys.atlassian.net', status: 'Finished 2 Oct', chip: '', projects: 'PAY', issues: 3140, last: '2 Oct', next: '' },
];
const spark = (runs) => { const max = Math.max(...runs.slice(1).map((r) => r.c + r.u + r.x)); return `<div class="spark" role="img" aria-label="Last ${runs.length - 1} delta runs: created, updated and conflicts">${runs.slice(1).map((r) => `<span class="b" title="Run ${r.n}: ${r.c} created, ${r.u} updated, ${r.x} conflicts">${r.c ? `<i class="c" style="height:${r.c / max * 100}%"></i>` : ''}${r.u ? `<i class="u" style="height:${r.u / max * 100}%"></i>` : ''}${r.x ? `<i class="x" style="height:${Math.max(8, r.x / max * 100)}%"></i>` : ''}</span>`).join('')}</div>`; };
function list() {
  return `<div class="col" style="gap:4px"><h1>Imports</h1><p class="mute">Each import stays connected until you finish the migration: run it again or let it sync hourly. Kupro only reads from the source. Edits made in Kupro win.</p></div>
  <div class="card" role="list">${CONNS.map((c) => `<div class="conn" role="listitem" tabindex="0" aria-current="${S.sel === c.id}" data-sel="${c.id}"><span class="src lg">${c.short}</span>
    <div class="col" style="gap:2px;min-width:0"><b>${c.name}</b><span class="sm mute trunc">${c.src}</span></div>
    <div class="col hide-s" style="gap:2px"><span class="chip ${c.chip}" style="align-self:flex-start">${c.id === 'ado' && S.syncing ? 'Syncing now' : c.status}</span><span class="xs mute">${c.issues ? fmt(c.issues) + ' issues · ' : ''}${c.projects} · last run ${c.last}${c.next ? ' · next ' + c.next : ''}</span></div>
    <div class="hide-s">${c.id === 'ado' ? spark(RUNS) : c.id === 'jira' ? '<span class="xs mute">Token deleted. History and aliases kept.</span>' : '<span class="xs mute">1 list has no state yet</span>'}</div>
    <div class="row hide-s">${c.id === 'ado' ? `<button class="btn sm" data-act="sync" ${S.syncing ? 'disabled' : ''}>${icon('refresh', 14)} Sync now</button>` : c.id === 'trello' ? '<button class="btn sm" data-act="map">Continue setup</button>' : '<button class="btn sm ghost" data-act="report">Report</button>'}</div></div>`).join('')}</div>
  ${S.sel === 'ado' ? adoDetail() : S.sel === 'trello' ? trelloDetail() : jiraDetail()}`;
}
function adoDetail() {
  const tabs = [['runs', 'Runs'], ['conflicts', 'Conflicts · 2'], ['mapping', 'Mapping'], ['people', 'People']];
  const body = {
    runs: () => `${S.syncing ? `<div class="card pad col"><div class="row"><b>Run 15 · ${phaseAt(S.pct)}</b><span class="grow"></span><span class="mono xs">delta since 14:00 (10 min overlap)</span></div><div class="bar"><i style="width:${S.pct * 100}%"></i></div></div>` : ''}
      <div class="card" style="overflow:hidden"><table class="t"><thead><tr><th>Run</th><th>When</th><th>Kind</th><th class="num">Created</th><th class="num">Updated</th><th class="num">Conflicts</th><th></th></tr></thead><tbody>
      ${RUNS.slice().reverse().slice(0, 8).map((r) => `<tr><td class="mono">${r.n}</td><td>${r.at}</td><td class="mute">${r.kind}</td><td class="num">${fmt(r.c)}</td><td class="num">${r.u}</td><td class="num">${r.x ? `<span style="color:var(--bad)">${r.x}</span>` : '0'}</td><td><button class="btn sm ghost" onclick="toast('Run ${r.n} report: per project, created, updated, re-parented, conflicts, source deletions.')">Report</button></td></tr>`).join('')}
      <tr><td colspan="7" class="sm mute">6 older runs</td></tr></tbody></table></div>`,
    conflicts: () => `<p class="sm mute">Someone changed these in Kupro after the last import. Kupro kept its value. The source value is shown so you can decide.</p>
      <div class="card" style="overflow:hidden"><table class="t"><thead><tr><th>Issue</th><th>Field</th><th>Kept in Kupro</th><th>Now in Azure DevOps</th><th></th></tr></thead><tbody>
      ${D.conflicts.map((c) => `<tr><td class="mono">${c.key}</td><td>${c.field}</td><td>${c.kupro}<div class="xs mute">edited by ${c.by}</div></td><td class="mute">${c.source}</td><td class="row"><button class="btn sm" onclick="toast('Kept. It won\\'t be listed again unless the source changes once more.')">Keep</button><button class="btn sm ghost" onclick="toast('Applied the source value as an edit by you, via import.')">Use source</button></td></tr>`).join('')}
      <tr><td class="mono">WEB-3990</td><td>Deleted in source</td><td>Still in Kupro, Canceled</td><td class="mute">gone</td><td><button class="btn sm ghost" onclick="toast('Left alone. Delete it in Kupro if you want.')">Dismiss</button></td></tr></tbody></table></div>`,
    mapping: () => `<div class="card pad col">${foldOptions(S.fold, 'setFold', { legend: 'Hierarchy: the team chose Keep Epics before run 1' })}
      ${S.foldPending ? `<span class="warnline">Mapping changes apply from the next run. Issues already imported keep their shape; only new work items use ${FOLD[S.fold].name}.</span><div class="row"><button class="btn sm" onclick="toast('Dry run of the next run: 4 to create, 38 to update, 0 re-parented.')">Preview next run</button></div>` : ''}</div>
      <div class="row" style="gap:12px;align-items:flex-start;flex-wrap:wrap"><div class="card grow" style="overflow:hidden;min-width:280px"><table class="t"><thead><tr><th>Type</th><th>Kupro</th></tr></thead><tbody>${D.types.map((t) => `<tr><td>${t.src}</td><td>${typeSelect(foldType(t, S.fold), t.src)}</td></tr>`).join('')}</tbody></table></div>
      <div class="card grow" style="overflow:hidden;min-width:280px"><table class="t"><thead><tr><th>State</th><th>Kupro</th></tr></thead><tbody>${D.states.map((s) => `<tr><td>${s.src}</td><td>${stateSelect(s.to, s.src)}</td></tr>`).join('')}</tbody></table></div></div>`,
    people: () => `<div class="card" style="overflow:hidden"><table class="t"><thead><tr><th>Person</th><th>Now</th><th></th></tr></thead><tbody>${D.people.filter((p) => p.action === 'placeholder').map((p) => `<tr><td><div class="row">${av(p.name, 1)}${p.name}</div></td><td><span class="chip">Placeholder</span> <span class="xs mute">${fmt(p.n)} items</span></td><td class="row"><button class="btn sm" ${p.email ? '' : 'disabled title="No email known"'} onclick="toast('Invite sent to ${p.email}. Their history follows them.')">Invite</button><button class="btn sm ghost" onclick="toast('Merge into… picks a member; every reference moves.')">Merge into…</button></td></tr>`).join('')}</tbody></table></div>`,
  }[S.tab];
  return `<div class="detail"><div class="col" style="gap:12px;min-width:0"><div class="row"><h2 class="grow">Contoso · Azure DevOps</h2></div>
    <div class="tabs" role="tablist">${tabs.map(([id, l]) => `<button role="tab" aria-selected="${S.tab === id}" onclick="S.tab='${id}';draw()">${l}</button>`).join('')}</div>${body()}</div>
    <aside class="card pad col"><h3>Connection</h3><dl class="kv"><dt>Source</dt><dd>Azure DevOps Services</dd><dt>Token</dt><dd>Encrypted · expires 3 Feb</dd><dt>Projects</dt><dd>Webshop, Mobile App, Platform</dd><dt>Cursor</dt><dd class="mono">2026-11-07 14:00</dd><dt>Owner</dt><dd>Mette Sørensen</dd></dl>
      <label class="check"><input type="checkbox" checked onchange="toast(this.checked?'Hourly sync on':'Hourly sync off. Sync by hand any time.')"> Sync every hour</label>
      <span class="xs mute">Turns itself off after 30 days with no change on either side. You'll get an email.</span><hr class="hr">
      <button class="btn danger" onclick="toast('Undo: deletes the 9,049 issues this import created. Refused while 3 native comments point at them; the dialog lists them.')">${icon('undo')} Undo import</button>
      <button class="btn" onclick="toast('Finish migration: stops sync, deletes the token, ends undo. Keys and history stay.')">${icon('flag')} Finish migration</button>
      <span class="xs mute">CLI: <code>kupro import report 7</code></span></aside></div>`;
}
function trelloDetail() {
  return `<div class="card pad col" style="max-width:720px"><h2>Marketing site · Trello</h2><p class="mute">Trello lists have no states of their own, so map each one. Kupro guessed by name where it could.</p>
    <div class="card" style="overflow:hidden"><table class="t"><thead><tr><th>List</th><th class="num">Cards</th><th>Kupro state</th></tr></thead><tbody>${D.trello.lists.map(([l, n, s]) => `<tr><td>${l}</td><td class="num">${n}</td><td>${stateSelect(s, l, !s)}</td></tr>`).join('')}</tbody></table></div>
    <div class="row wrap"><label class="check"><input type="checkbox"> Make cards with checklist items that have their own member or due date into Features</label></div>
    <div class="row"><span class="grow"></span><button class="btn primary" onclick="toast('Dry run: 186 issues in MKT, 23 archived skipped, 41 checklists kept in descriptions.')">Run dry run</button></div></div>`;
}
function jiraDetail() { return `<div class="card pad col" style="max-width:720px"><h2>Payments · Jira Cloud</h2><span class="okline">Finished 2 Oct: 3,140 issues, 212 Stories promoted to Feature, 0 open conflicts.</span><p class="sm mute">The token was deleted when the migration finished. PAY-123 keys kept; old Jira URLs still open the issue.</p>${initiativeOptions('label', 'void', { disabled: true, legend: 'Initiatives: the team chose a label on its Epics (locked after Finish)' })}</div>`; }
function drawer() {
  if (!S.drawer) return '';
  return `<div class="scrim" onclick="closeNew()"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="New import"><header><h2 class="grow">New import</h2><button class="btn ghost sm" onclick="closeNew()" aria-label="Close">${icon('x', 14)}</button></header>
    <div class="bd"><div class="srcs" role="group" aria-label="Source">${D.sources.slice(0, 8).map((s) => `<button aria-pressed="${S.newSrc === s.id}" onclick="S.newSrc='${s.id}';redrawer()"><span class="src">${s.short}</span><span class="col" style="gap:0"><b>${s.name}</b><span class="xs mute">${s.sub}</span></span></button>`).join('')}</div>
    ${S.newSrc === 'trello' ? `<p class="sm">Trello asks you to approve read access for Kupro.</p><button class="btn" style="align-self:flex-start" onclick="toast('Opens Trello\\'s authorize page; you come back here.')">Authorize on Trello</button>` : `<label class="field"><span>URL</span><input class="input" placeholder="https://"></label><label class="field"><span>Token</span><input class="input" type="password"></label>`}
    <span class="sm mute">Next you pick boards or projects and map them. The import shows up in the list as a draft until its first run.</span></div>
    <footer><span class="grow"></span><button class="btn" onclick="closeNew()">Cancel</button><button class="btn primary" onclick="closeNew();S.sel='trello';draw();toast('Connected. Map the lists to continue.')">Connect</button></footer></div>`;
}
function redrawer() { $('#drawerHost').innerHTML = drawer(); }
let lastFocus;
function openNew() { lastFocus = document.activeElement; S.drawer = 1; redrawer(); $('.drawer button[aria-pressed="true"]').focus(); }
function closeNew() { S.drawer = null; redrawer(); lastFocus && lastFocus.focus(); }
function draw() { $('#app').innerHTML = list(); }
function sync() {
  S.syncing = true; S.tab = 'runs'; draw();
  simulate((p) => { S.pct = p; const b = $('#app .bar i'); if (b) b.style.width = p * 100 + '%'; }, () => {
    S.syncing = false; RUNS.push({ n: 15, c: 1, u: 9, x: 0, at: 'Today 14:12', kind: 'Delta, by hand' }); CONNS[0].last = 'just now'; CONNS[0].issues += 1; draw();
    toast('Run 15: 1 created, 9 updated, 0 conflicts');
  }, 1800);
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (a) { e.stopPropagation(); if (a.dataset.act === 'sync') sync(); if (a.dataset.act === 'map') { S.sel = 'trello'; draw(); } if (a.dataset.act === 'report') { S.sel = 'jira'; draw(); } return; }
  const r = e.target.closest('[data-sel]'); if (r) { S.sel = r.dataset.sel; draw(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.drawer) closeNew();
  if (e.key === 'Enter' && e.target.matches('[data-sel]')) { S.sel = e.target.dataset.sel; draw(); $(`[data-sel="${S.sel}"]`).focus(); }
  if (e.key.toLowerCase() === 'n' && !e.target.matches('input, select, textarea') && !S.drawer) { e.preventDefault(); openNew(); }
});
draw();
</script>
</body>
</html>
