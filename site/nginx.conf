# Public site (ADR-017): static files from `astro build` (build.format = file, so /pricing is pricing.html).

# Agents get the Markdown twin of a page (integrations/agents.mjs) when Accept names text/markdown without q=0.
# A regex, not full q-value ranking: browsers never send text/markdown, and agents that do list it first.
map $http_accept $md {
    default "";
    "~*text/markdown(?![^,]*;\s*q\s*=\s*0(\.0*)?\s*(;|,|$))" ".md";
}

# Pages (paths without a dot) advertise their twin. add_header skips error responses, so 404s don't.
# $request_uri, not $uri: try_files rewrites $uri to the file it found (pricing.html).
map $request_uri $md_link {
    default "";
    "~^/(\?.*)?$" "</index.md>; rel=\"alternate\"; type=\"text/markdown\"";
    "~^(?<page>/[^.?]+)(\?.*)?$" "<$page.md>; rel=\"alternate\"; type=\"text/markdown\"";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/markdown text/plain application/json;

    # nginx's mime.types has no .md; a second types block adds to the first.
    include /etc/nginx/mime.types;
    types { text/markdown md; }
    charset utf-8;
    charset_types text/markdown text/plain application/json;

    # add_header in a location replaces the server's, so every location includes the same set.
    include /etc/nginx/snippets/headers.conf;

    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/snippets/headers.conf;
        internal;
    }

    location = / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        add_header Vary "Accept";
        add_header Link $md_link;
        try_files /index$md /index.html =404;
    }

    # Hashed build output never changes.
    location /_astro/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # CLI install scripts (ADR-018). As text: PowerShell's irm hands bytes to iex for the default binary type, and iex fails.
    location ~ ^/install\.(sh|ps1)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # Trailing slashes and .html are never canonical: /pricing/ and /pricing.html redirect to /pricing.
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        add_header Vary "Accept";
        add_header Link $md_link;
        try_files $uri$md $uri $uri.html =404;
    }
}
