# Public site (ADR-017): static files from `astro build` (build.format = file, so /pricing is pricing.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # add_header in a location replaces the server's, so every location includes the same set.
    include /etc/nginx/snippets/headers.conf;

    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/snippets/headers.conf;
        internal;
    }

    location = / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Hashed build output never changes.
    location /_astro/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Trailing slashes and .html are never canonical: /pricing/ and /pricing.html redirect to /pricing.
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }
}
