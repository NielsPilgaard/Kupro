# E2E stack: the production compose file plus host ports, on a CI runner or locally (e2e.yml).
# Only `web` and its dependencies start; the Grafana stack and the backup agent are left out.
#
#   docker compose -p flowstate-e2e -f deploy/docker-compose.yaml -f tests/e2e/compose.yaml \
#     --env-file tests/e2e/e2e.env up -d web
#
# Ports match the dev realm: it allows the SPA only on :5180, and the web image is built with Keycloak on :8180.
services:
  keycloak:
    ports:
      - "8180:8080"
    # The image holds the realm only; E2E signs in as the dev user.
    volumes:
      - ../src/Flowstate.AppHost/Realms/flowstate-users-0.json:/opt/keycloak/data/import/flowstate-users-0.json:ro
  web:
    ports:
      - "5180:80"
# Production pins the data volumes as external (ADR-016). Here they belong to the E2E project instead, so they never
# touch a local dev stack's volumes of the same name, and `down -v` removes them.
volumes:
  flowstate-pgdata-a:
    external: false
  flowstate-pgdata-b:
    external: false
  flowstate-pg-control:
    external: false
  flowstate-wal-receive:
    external: false
  flowstate-backup-agent-state:
    external: false
