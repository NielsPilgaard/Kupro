services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.6"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "flowstate-postgres-data"
        read_only: false
    networks:
      - "aspire"
  keycloak:
    image: "quay.io/keycloak/keycloak:26.6"
    command:
      - "start"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "resource-indicators,cimd"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "keycloak"
    expose:
      - "8080"
      - "9000"
    volumes:
      - type: "volume"
        target: "/opt/keycloak/data"
        source: "flowstate-keycloak-data"
        read_only: false
      - type: "bind"
        target: "/opt/keycloak/data/import"
        source: "${KEYCLOAK_BINDMOUNT_0}"
        read_only: true
    networks:
      - "aspire"
  migrations:
    image: "${MIGRATIONS_IMAGE}"
    command:
      - "migrate"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${MIGRATIONS_PORT}"
      ConnectionStrings__flowstate: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=flowstate"
      FLOWSTATE_HOST: "postgres"
      FLOWSTATE_PORT: "5432"
      FLOWSTATE_USERNAME: "postgres"
      FLOWSTATE_PASSWORD: "${POSTGRES_PASSWORD}"
      FLOWSTATE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/flowstate"
      FLOWSTATE_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/flowstate"
      FLOWSTATE_DATABASENAME: "flowstate"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "migrations"
    expose:
      - "${MIGRATIONS_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__flowstate: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=flowstate"
      FLOWSTATE_HOST: "postgres"
      FLOWSTATE_PORT: "5432"
      FLOWSTATE_USERNAME: "postgres"
      FLOWSTATE_PASSWORD: "${POSTGRES_PASSWORD}"
      FLOWSTATE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/flowstate"
      FLOWSTATE_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/flowstate"
      FLOWSTATE_DATABASENAME: "flowstate"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      services__keycloak__http__0: "http://keycloak:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "${API_PORT}"
    depends_on:
      migrations:
        condition: "service_completed_successfully"
      keycloak:
        condition: "service_started"
    networks:
      - "aspire"
  web:
    image: "${WEB_IMAGE}"
    environment:
      API_UPSTREAM: "http://api:${API_PORT}"
    ports:
      - "80"
    depends_on:
      api:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  flowstate-postgres-data:
    driver: "local"
  flowstate-keycloak-data:
    driver: "local"
