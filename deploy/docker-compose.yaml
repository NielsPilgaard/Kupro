services:
  loki:
    image: "grafana/loki:3.7.8"
    command:
      - "-config.file=/etc/loki/flowstate.yaml"
    expose:
      - "3100"
    volumes:
      - type: "bind"
        target: "/etc/loki/flowstate.yaml"
        source: "../infrastructure/observability/loki.yaml"
        read_only: true
      - type: "volume"
        target: "/loki"
        source: "flowstate-loki-data"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "768m"
  tempo:
    image: "grafana/tempo:3.1.0"
    command:
      - "-target=all"
      - "-config.file=/etc/tempo/flowstate.yaml"
    expose:
      - "3200"
      - "4318"
    volumes:
      - type: "bind"
        target: "/etc/tempo/flowstate.yaml"
        source: "../infrastructure/observability/tempo.yaml"
        read_only: true
      - type: "volume"
        target: "/var/tempo"
        source: "flowstate-tempo-data"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "768m"
  prometheus:
    image: "prom/prometheus:v3.15.0"
    command:
      - "--config.file=/etc/prometheus/flowstate.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-otlp-receiver"
      - "--web.enable-remote-write-receiver"
    expose:
      - "9090"
    volumes:
      - type: "bind"
        target: "/etc/prometheus/flowstate.yaml"
        source: "../infrastructure/observability/prometheus.yaml"
        read_only: true
      - type: "volume"
        target: "/prometheus"
        source: "flowstate-prometheus-data"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "512m"
  alloy:
    image: "grafana/alloy:v1.20.1"
    command:
      - "run"
      - "/etc/alloy/flowstate"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "--disable-reporting"
    environment:
      LOKI_URL: "http://loki:3100"
      PROMETHEUS_URL: "http://prometheus:9090"
      TEMPO_OTLP_URL: "http://tempo:4318"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_ADDRESS: "postgres:5432"
      KEYCLOAK_MANAGEMENT_ADDRESS: "keycloak:9000"
      KEYCLOAK_MANAGEMENT_SCHEME: "http"
    expose:
      - "4318"
      - "12345"
    volumes:
      - type: "bind"
        target: "/etc/alloy/flowstate/flowstate.alloy"
        source: "../infrastructure/observability/alloy/flowstate.alloy"
        read_only: true
      - type: "bind"
        target: "/etc/alloy/flowstate/export.alloy"
        source: "../infrastructure/observability/alloy/export.alloy"
        read_only: true
    networks:
      - "aspire"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "384m"
  grafana:
    image: "grafana/grafana:13.2.3"
    environment:
      PROMETHEUS_URL: "http://prometheus:9090"
      LOKI_URL: "http://loki:3100"
      TEMPO_URL: "http://tempo:3200"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_PUBLIC_URL}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.tem.scaleway.com:587"
      GF_SMTP_USER: "${SMTP_USER}"
      GF_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "${GRAFANA_SMTP_FROM}"
      ALERT_EMAIL: "${ALERT_EMAIL}"
    expose:
      - "3000"
    volumes:
      - type: "bind"
        target: "/etc/grafana/provisioning"
        source: "../infrastructure/observability/grafana/provisioning"
        read_only: true
      - type: "bind"
        target: "/etc/grafana/dashboards"
        source: "../infrastructure/observability/grafana/dashboards"
        read_only: true
      - type: "volume"
        target: "/var/lib/grafana"
        source: "flowstate-grafana-data"
        read_only: false
    depends_on:
      loki:
        condition: "service_started"
      tempo:
        condition: "service_started"
      prometheus:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: "384m"
  postgres:
    image: "docker.io/library/postgres:18"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "flowstate-postgres-data"
        read_only: false
      - type: "bind"
        target: "/docker-entrypoint-initdb.d"
        source: "../infrastructure/postgres/init"
        read_only: true
    networks:
      - "aspire"
    restart: "unless-stopped"
  keycloak:
    image: "${KEYCLOAK_IMAGE}"
    command:
      - "start"
      - "--import-realm"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_PASSWORD}"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "resource-indicators,cimd"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL}"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: "postgres"
      KC_DB_URL: "jdbc:postgresql://postgres:5432/keycloak"
      KC_DB_USERNAME: "keycloak"
      KC_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"
      REALM_APP_URL: "${API_PUBLIC_URL}"
      REALM_SMTP_HOST: "smtp.tem.scaleway.com"
      REALM_SMTP_PORT: "587"
      REALM_SMTP_STARTTLS: "true"
      REALM_SMTP_AUTH: "true"
      REALM_SMTP_USER: "${SMTP_USER}"
      REALM_SMTP_PASSWORD: "${SMTP_PASSWORD}"
      REALM_SMTP_FROM: "${KEYCLOAK_SMTP_FROM}"
    expose:
      - "8080"
      - "9000"
    volumes:
      - type: "volume"
        target: "/opt/keycloak/data"
        source: "flowstate-keycloak-data"
        read_only: false
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
  migrations:
    image: "${MIGRATIONS_IMAGE}"
    command:
      - "migrate"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__flowstate: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=flowstate"
      FLOWSTATE_HOST: "postgres"
      FLOWSTATE_PORT: "5432"
      FLOWSTATE_USERNAME: "postgres"
      FLOWSTATE_PASSWORD: "${POSTGRES_PASSWORD}"
      FLOWSTATE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/flowstate"
      FLOWSTATE_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/flowstate"
      FLOWSTATE_DATABASENAME: "flowstate"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "migrations"
    depends_on:
      postgres:
        condition: "service_started"
      alloy:
        condition: "service_started"
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__flowstate: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=flowstate"
      FLOWSTATE_HOST: "postgres"
      FLOWSTATE_PORT: "5432"
      FLOWSTATE_USERNAME: "postgres"
      FLOWSTATE_PASSWORD: "${POSTGRES_PASSWORD}"
      FLOWSTATE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/flowstate"
      FLOWSTATE_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/flowstate"
      FLOWSTATE_DATABASENAME: "flowstate"
      KEYCLOAK_HTTP: "http://keycloak:8080"
      services__keycloak__http__0: "http://keycloak:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_SERVICE_NAME: "api"
      Auth__PublicAuthority: "${KEYCLOAK_PUBLIC_URL}/realms/flowstate"
      Api__PublicUrl: "${API_PUBLIC_URL}"
      Storage__ServiceUrl: "${STORAGE_URL}"
      Storage__Region: "${STORAGE_REGION}"
      Storage__Bucket: "${STORAGE_BUCKET}"
      Storage__AccessKey: "${STORAGE_ACCESS_KEY}"
      Storage__SecretKey: "${STORAGE_SECRET_KEY}"
    depends_on:
      migrations:
        condition: "service_completed_successfully"
      keycloak:
        condition: "service_started"
      alloy:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/localhost/$${HTTP_PORTS} && printf 'GET /alive HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: "10s"
      timeout: "5s"
      retries: 6
      start_period: "30s"
  web:
    image: "${WEB_IMAGE}"
    environment:
      API_UPSTREAM: "http://api:${API_PORT}"
    depends_on:
      api:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  flowstate-loki-data:
    driver: "local"
  flowstate-tempo-data:
    driver: "local"
  flowstate-prometheus-data:
    driver: "local"
  flowstate-grafana-data:
    driver: "local"
  flowstate-postgres-data:
    driver: "local"
  flowstate-keycloak-data:
    driver: "local"
