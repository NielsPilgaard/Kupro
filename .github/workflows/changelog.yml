name: Changelog

# Every Monday Claude turns last week's `feat` commits into an English and Danish entry in
# site/src/changelog.ts (shown on /news and /da/nyheder). Opens a PR for review; never pushes to main.
#
# Claude usage comes from the subscription via CLAUDE_CODE_OAUTH_TOKEN, and weeks without new `feat`
# commits, or with last week's PR still open, use none.

on:
  schedule:
    - cron: "0 3 * * 1"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find new feat commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create changelog --repo "$GITHUB_REPOSITORY" --color 2C7A6A \
            --description "Opened by the changelog workflow" --force
          echo "date=$(TZ=Europe/Copenhagen date +%F)" >> "$GITHUB_OUTPUT"

          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label changelog --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "Open changelog PR exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          since=$(grep -m1 -oE "date: '[0-9]{4}-[0-9]{2}-[0-9]{2}'" site/src/changelog.ts | grep -oE '[0-9-]{10}')
          if [ -z "$since" ]; then
            echo "Could not read the latest date from site/src/changelog.ts" >&2
            exit 1
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

          count=$(git log --since="${since}T23:59:59" --pretty=%s | grep -cE '^feat(\(|!|:)' || true)
          echo "$count feat commits since $since"
          if [ "$count" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.skip != 'true'
        with:
          bun-version-file: site/package.json

      - name: Install site dependencies
        if: steps.check.outputs.skip != 'true'
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Run Claude
        id: claude
        if: steps.check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}

            You are writing this week's entry on the Kupro news page (/news, Danish /da/nyheder). Kupro is an issue
            tracker and planner with a meeting agent, a CLI and an MCP server. Readers are developers, team leads
            and the agents they run: technical, busy, allergic to hype.
            Read docs/branding.md first (voice, and the English/Danish glossary you must use exactly).

            Steps:
            1. List what shipped: `git log --since="${{ steps.check.outputs.since }}T23:59:59" --pretty="%h %s"`.
               Read `git show --stat <sha>` and the diff of any commit whose user impact is unclear.
            2. Keep only changes a user or their agent would notice: new features, new commands or options in the
               web app, CLI or MCP, clearly better screens, fixed bugs users hit. Drop refactors, tests, CI, docs,
               dependencies, observability, deploy and infrastructure work, and performance work nobody can feel.
               Drop anything not reachable yet (for example backend work whose screen or command hasn't shipped).
               If nothing is left, stop without changing files or opening a PR.
            3. Add ONE new entry at the top of the `changelog` array in site/src/changelog.ts:
               `date: '${{ steps.check.outputs.date }}'`, then `en` and `da`, each with a short title naming the
               biggest change and one sentence per change. Say what people can now do, not how it was built.
               Wrap commands, flags and keys in backticks. Danish is written Danish, not translated English (du-form,
               Danish punctuation). Match the tone and length of the existing entries. At most 6 changes; merge
               small related ones. Never promise more than the change does.
            4. Verify: `bun run --cwd site build 2>&1 | tail -n 40`. Fix any error.
            5. Create branch `changelog/${{ steps.check.outputs.date }}`, commit with message
               `docs(changelog): add ${{ steps.check.outputs.date }} entry`, push, and run
               `gh pr create --base main --label changelog --title "docs(changelog): news ${{ steps.check.outputs.date }}" --body "<body>"`.
               Body: the commits you included, the ones you left out and why (one line each).

            Hard limits:
            - Only edit site/src/changelog.ts.
            - Never invent changes. Every sentence must trace back to a commit in the list.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Edit,Glob,Grep,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(bun run --cwd site build:*),Bash(tail:*),Bash(head:*)"

      # Full output is hidden (public repo = public logs). Print only the commands Claude ran,
      # anything the allowlist blocked, and its final message.
      - name: Summarize Claude run
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "## Tool calls"
            jq -r '(if type=="array" then .[] else . end)
              | select(.type=="assistant") | .message.content[]?
              | select(.type=="tool_use")
              | "- \(.name): \(.input.command // .input.pattern // .input.file_path // "" | tostring | .[0:200])"' "$LOG"
            echo "## Blocked by allowlist"
            jq -r '(if type=="array" then .[] else . end)
              | select(.type=="result") | .permission_denials[]?
              | "- \(.tool_name): \(.tool_input | tostring | .[0:200])"' "$LOG"
            echo "## Final message"
            jq -r '(if type=="array" then .[] else . end) | select(.type=="result") | .result // ""' "$LOG"
          } | tee -a "$GITHUB_STEP_SUMMARY"
