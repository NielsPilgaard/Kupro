name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build, test, drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Build (emits openapi/flowstate.json)
        run: dotnet build Flowstate.slnx -c Release

      - name: OpenAPI spec drift
        run: git diff --exit-code -- openapi/ || (echo "::error::openapi/ is stale — build locally and commit the spec" && exit 1)

      - name: Test (incl. ADR-010 latency budget on 10k issues)
        run: dotnet test --solution Flowstate.slnx -c Release --no-build
        env:
          FLOWSTATE_PERF_REPORT: ${{ github.step_summary }}

      - name: Compose drift
        run: |
          dotnet aspire publish -o deploy --non-interactive --nologo
          git diff --exit-code -- deploy/docker-compose.yaml || (echo "::error::deploy/ is stale — run 'aspire publish -o deploy' and commit" && exit 1)

  web:
    name: Web lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run i18n:check
      - run: bun run test
      - run: bun run build

  grafana:
    name: Grafana dashboards drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate dashboards and alert rules
        run: python3 infrastructure/observability/build_dashboards.py
      - name: Drift
        run: git diff --exit-code -- infrastructure/observability/ || (echo "::error::infrastructure/observability/ is stale — run build_dashboards.py and commit" && exit 1)

  cli:
    name: CLI AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-14, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore

      - name: Publish native binary
        run: dotnet publish src/Flowstate.Cli -c Release -r ${{ matrix.rid }} -o out

      - name: Cold start under 50 ms (task 005)
        if: matrix.rid == 'linux-x64'
        run: |
          ./out/flowstate --help > /dev/null
          start=$(date +%s%N); ./out/flowstate --help > /dev/null; end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 )); echo "cold start: ${ms} ms"
          test "$ms" -lt 50

      - uses: actions/upload-artifact@v4
        with:
          name: flowstate-${{ matrix.rid }}
          path: out/flowstate*

  web-image:
    name: Web image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f web/Dockerfile .
