name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET build, test, drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # A cold-cache restore misattributes commands between tools (dotnet/sdk#53783); the retry hits the warm cache.
      - name: Restore tools
        run: dotnet tool restore || dotnet tool restore

      - name: Build (emits openapi/kupro.json)
        run: dotnet build Kupro.slnx -c Release

      - name: OpenAPI spec drift
        run: git diff --exit-code -- openapi/ || (echo "::error::openapi/ is stale — build locally and commit the spec" && exit 1)

      - name: Test (incl. ADR-010 latency budget on 10k issues)
        run: dotnet test --solution Kupro.slnx -c Release --no-build
        env:
          KUPRO_PERF_REPORT: ${{ github.step_summary }}

      - name: Compose drift
        run: |
          dotnet aspire publish -o deploy --non-interactive --nologo
          git diff --exit-code -- deploy/docker-compose.yaml || (echo "::error::deploy/ is stale — run 'aspire publish -o deploy' and commit" && exit 1)

  web:
    name: Web lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run i18n:check
      - run: bun run test
      - run: bun run build

  site:
    name: Site typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: site/package.json

      - run: bun install --frozen-lockfile
      # astro check + astro build (ADR-017).
      - run: bun run build

  grafana:
    name: Grafana dashboards drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate dashboards and alert rules
        run: python3 infrastructure/observability/build_dashboards.py
      - name: Drift
        run: git diff --exit-code -- infrastructure/observability/ || (echo "::error::infrastructure/observability/ is stale — run build_dashboards.py and commit" && exit 1)

  cli:
    name: CLI AOT (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-14, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Retry: dotnet/sdk#53783 (see the dotnet job). `||` works in bash and pwsh 7 alike.
      - run: dotnet tool restore || dotnet tool restore

      - name: Publish native binary
        run: dotnet publish src/Kupro.Cli -c Release -r ${{ matrix.rid }} -o out

      - name: Cold start under 50 ms (task 005)
        if: matrix.rid == 'linux-x64'
        run: |
          ./out/kupro --help > /dev/null
          start=$(date +%s%N); ./out/kupro --help > /dev/null; end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 )); echo "cold start: ${ms} ms"
          test "$ms" -lt 50

      - uses: actions/upload-artifact@v4
        with:
          name: kupro-${{ matrix.rid }}
          path: out/kupro*

  # Playwright against the production compose file, with images built from the PR's code. Pushes to main get the
  # same suite in Staging, against the published images, before deploy.
  e2e:
    name: E2E
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/e2e.yml

  # Images are tagged sha-<commit>; Staging tests and deploys exactly that tag (cd.yml).
  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest
    needs: [dotnet]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both flags stamp the commit into service.version and /api/v1/status (ADR-014 IMP-005); cd.yml checks it.
      - name: Build and push
        run: >-
          dotnet publish src/Kupro.Api -c Release -t:PublishContainer --os linux --arch x64
          -p:ContainerRegistry=ghcr.io "-p:ContainerRepository=${GITHUB_REPOSITORY_OWNER,,}/kupro-api"
          '-p:ContainerImageTags="sha-${{ github.sha }};latest"'
          -p:SourceRevisionId=${{ github.sha }} -p:IncludeSourceRevisionInInformationalVersion=true

  # Keycloak with the kupro theme and the realm (infrastructure/keycloak).
  publish-keycloak:
    name: Publish Keycloak image
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kupro-keycloak" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,scope=keycloak,mode=max

  # Postgres and the backup agent (ADR-016) are tagged by their sources (scripts/infra-image-tags.sh), not the commit,
  # so a deploy only replaces the database container when infrastructure/postgres changed. Built only when missing.
  publish-infra:
    name: Publish Postgres and backup-agent images
    runs-on: ubuntu-latest
    needs: [dotnet]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image names and tags
        run: |
          echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kupro" >> "$GITHUB_ENV"
          scripts/infra-image-tags.sh >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Which images are missing
        id: missing
        run: |
          missing() { docker buildx imagetools inspect "$1" > /dev/null 2>&1 && echo false || echo true; }
          echo "postgres=$(missing "$PREFIX-postgres:$POSTGRES_TAG")" >> "$GITHUB_OUTPUT"
          echo "agent=$(missing "$PREFIX-backup-agent:$BACKUP_AGENT_TAG")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        if: steps.missing.outputs.postgres == 'true'
        with:
          context: infrastructure/postgres
          push: true
          tags: ${{ env.PREFIX }}-postgres:${{ env.POSTGRES_TAG }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - uses: docker/build-push-action@v6
        if: steps.missing.outputs.agent == 'true'
        with:
          context: .
          file: infrastructure/backup-agent/Dockerfile
          push: true
          tags: ${{ env.PREFIX }}-backup-agent:${{ env.BACKUP_AGENT_TAG }}
          cache-from: type=gha,scope=backup-agent
          cache-to: type=gha,scope=backup-agent,mode=max

  # VITE_KEYCLOAK_URL is baked in at build time, so this waits for the repository variable (deploy runbook).
  publish-web:
    name: Publish web image
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.KEYCLOAK_PUBLIC_URL != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kupro-web" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: VITE_KEYCLOAK_URL=${{ vars.KEYCLOAK_PUBLIC_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # Public website (ADR-017). SITE_URL (canonical links) and APP_URL (sign-in links) are baked in at build time.
  publish-site:
    name: Publish site image
    runs-on: ubuntu-latest
    needs: [site]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.SITE_URL != ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kupro-site" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
            PUBLIC_APP_URL=${{ vars.APP_URL }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,scope=site,mode=max
