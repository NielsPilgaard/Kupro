name: CLA

# CLA Assistant Lite (ADR-007): contributors sign CLA.md by commenting on their first PR; signatures are committed to
# the cla-signatures branch. pull_request_target never checks out PR code here, so the write token is safe.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # v2.6.1. The upstream repo is archived; pinned by SHA so it can't change under us.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: NielsPilgaard,*[bot]
