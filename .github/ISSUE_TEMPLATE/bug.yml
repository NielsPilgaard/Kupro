name: Bug report
description: Something in Kupro doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the board
        2. Drag an issue to Done
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Web app
        - REST API
        - CLI
        - MCP
        - Meeting agent
        - Self-hosting / deploy
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit you run, or `kupro --version` for the CLI.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens and personal data first.
