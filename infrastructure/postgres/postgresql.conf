# Postgres config (ADR-016), dev and prod. Loaded with -c config_file=..., so the postgresql.conf
# that initdb writes into PGDATA is ignored. Memory is sized for the 8 GB VPS (ADR-004); the
# AppHost lowers it under aspire run.

listen_addresses = '*'
port = 5432
max_connections = 100
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 64MB
work_mem = 8MB
dynamic_shared_memory_type = posix

timezone = 'Etc/UTC'
log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'
lc_messages = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

# WAL leaves Postgres only through the backup agent's replication slot (ADR-016).
# No archive_command: a broken backup setup must never be able to fill the disk.
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
# Postgres drops the agent's slot instead of filling the disk if the agent falls this
# far behind. That leaves a gap in the WAL chain and an alert, never an outage.
max_slot_wal_keep_size = 4GB
wal_keep_size = 0
archive_mode = off

# Lets the restore wizard offer "just before migration X": the commit time of each
# __EFMigrationsHistory row.
track_commit_timestamp = on

log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_replication_commands = on
