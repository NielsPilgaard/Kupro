# TYPE  DATABASE      USER           ADDRESS   METHOD
#
# The backup agent shares the socket volume and runs as uid 999, which this container
# knows as OS user "postgres". pg_ident maps that to backup_agent and nothing else.
local   all           backup_agent             peer map=agent
local   replication   backup_agent             peer map=agent

# Everyone else needs a password, on the socket too. Otherwise uid 999 in the agent
# container would be a superuser through "local all postgres peer".
local   all           all                      scram-sha-256
host    all           all            all       scram-sha-256
