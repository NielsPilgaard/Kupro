# pgBackRest config for the backup agent (ADR-016). Secrets and the repo endpoint
# come from PGBACKREST_* env vars set in Dokploy, never from this file:
#   PGBACKREST_REPO1_S3_ENDPOINT, PGBACKREST_REPO1_S3_REGION, PGBACKREST_REPO1_S3_BUCKET,
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# Env vars win over this file, so local dev overrides e.g. the endpoint the same way.

[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc

# Daily fulls with time retention 34: the oldest full is 34-35 days old while fulls succeed,
# so no restorable data is older than the 35 days the DPA promises. Keep in step with
# Agent__RetentionDays (AgentOptions.RetentionDays).
repo1-retention-full-type=time
repo1-retention-full=34

# Postgres has no archive_mode: WAL is streamed by the agent (ADR-016). pgBackRest refuses
# a backup that checks the archive without archive_mode (error 087), so the agent checks
# that each backup's WAL reached the repo itself. That also rules out archive-copy.
archive-check=n

compress-type=zst
start-fast=y
process-max=2
log-level-console=info
log-level-stderr=warn
log-level-file=off

[main]
# No pg1-path here: the agent passes the live volume (/pgdata/a or /pgdata/b) on every call, because
# it changes when a restore goes live. pgBackRest refuses a pg1-path that differs from the server's
# data_directory (error 058), so the volumes have the same paths in both containers.
pg1-socket-path=/var/run/postgresql
pg1-user=backup_agent
