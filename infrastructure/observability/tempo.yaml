# Single-binary Tempo on local disk. Receives OTLP from the collector; Grafana queries it on :3200. ADR-014.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

query_frontend:
  # Tempo's own MCP tools, which mcp-grafana loads through Grafana's datasource proxy.
  mcp_server:
    enabled: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 720h

# No usage reports to Grafana Labs (ADR-006).
usage_report:
  reporting_enabled: false
