# `aspire run` only: also forward everything to the Aspire dashboard, merged onto otel-collector.yaml
# (exporter lists are appended via the confmap.enableMergeAppendOption feature gate).
exporters:
  otlp_grpc/aspire:
    endpoint: ${env:ASPIRE_DASHBOARD_OTLP_URL}
    headers:
      x-otlp-api-key: ${env:ASPIRE_DASHBOARD_OTLP_API_KEY}
    tls:
      # The dashboard uses the local ASP.NET dev certificate.
      insecure_skip_verify: true

service:
  pipelines:
    logs:
      exporters: [otlp_grpc/aspire]
    traces:
      exporters: [otlp_grpc/aspire]
    metrics:
      exporters: [otlp_grpc/aspire]
