# Dashboards are generated by build_dashboards.py and read-only in the UI; edit the script, not Grafana.
apiVersion: 1

providers:
  - name: flowstate
    # Matched by title, no folderUid: alert rule provisioning (by title only) may create the folder first.
    folder: Flowstate
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
