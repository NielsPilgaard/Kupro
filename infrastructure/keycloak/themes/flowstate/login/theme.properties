# Flowstate sign-in pages: Keycloak's keycloak.v2 theme (PatternFly 5), restyled with the web app's tokens.
# Templates stay Keycloak's, so registration, device login (CLI), consent (MCP) and password reset all keep working.
# tokens.css and the mark SVGs are copied in by infrastructure/keycloak/Dockerfile.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/tokens.css css/flowstate.css
locales=en,da
