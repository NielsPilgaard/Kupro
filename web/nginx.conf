# SPA + same-origin API proxy. ${API_UPSTREAM} is substituted at container start (nginx templates).

# Keep the scheme the TLS edge (Traefik) sent; $scheme here is always http. The API builds public URLs from it.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # SignalR (task 012) needs websocket upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # Remote MCP server and its OAuth Protected Resource Metadata (RFC 9728) live in the API.
    location = /mcp {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Streamable HTTP responses can be server-sent events.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Agent discovery (MCP server card, llms.txt) and the OpenAPI spec they point to, served by the API.
    location ~ ^/(\.well-known/mcp\.json|llms\.txt|openapi/v1\.json)$ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /.well-known/oauth-protected-resource {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build output never changes.
    location /assets/ {
        # Precompressed at level 9 in the image build.
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
